<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>3-Bob Kiruvchi Test | 11-sinf Astronomiya — Astrofizika va tadqiqot metodlari</title>
  <style>
    :root {
      --bg: #050914;
      --panel: rgba(13, 21, 38, 0.94);
      --card: rgba(15, 23, 42, 0.88);
      --border: rgba(56, 189, 248, 0.28);
      --accent: #38bdf8;
      --gold: #fbbf24;
      --emerald: #34d399;
      --rose: #fb7185;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 0%, #0f1c38 0%, var(--bg) 80%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 13px 18px;
      background: rgba(5, 9, 20, 0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand h1 { font-size: 1.02rem; color: var(--accent); font-weight: 700; }
    .brand p { font-size: 0.78rem; color: var(--muted); }

    .mode-tabs { display: flex; gap: 6px; flex-wrap: wrap; }

    .tab-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.18s;
    }

    .tab-btn:hover { border-color: var(--accent); }
    .tab-btn.active {
      background: linear-gradient(135deg, #0284c7, #1d4ed8);
      border-color: #7dd3fc;
      color: #fff;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gold);
    }

    .btn {
      background: linear-gradient(135deg, #0284c7, #1d4ed8);
      border: 1px solid #7dd3fc;
      color: #fff;
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover { filter: brightness(1.12); }
    .btn.secondary {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(148, 163, 184, 0.35);
      color: var(--text);
    }

    .container {
      max-width: 980px;
      margin: 20px auto;
      padding: 0 16px 50px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .meta-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }

    .meta-card label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
    .meta-card input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(2, 6, 23, 0.85);
      color: var(--text);
      font-size: 0.88rem;
    }

    .q-card {
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 17px 20px;
    }

    .q-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 700;
    }

    .q-text {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
    }

    .opts { display: flex; flex-direction: column; gap: 8px; }

    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 10px 13px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(30, 41, 59, 0.82);
      color: var(--text);
      font-size: 0.88rem;
      cursor: pointer;
      transition: 0.16s;
    }

    .opt-btn:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.14); }
    .opt-btn.selected { border-color: var(--gold); background: rgba(251, 191, 36, 0.18); }
    .opt-btn.correct { border-color: var(--emerald); background: rgba(16, 185, 129, 0.25); color: #d1fae5; }
    .opt-btn.wrong { border-color: var(--rose); background: rgba(244, 63, 94, 0.25); color: #ffe4e6; }

    .explain {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(148, 163, 184, 0.25);
      font-size: 0.84rem;
      color: var(--emerald);
      display: none;
    }

    .result-box {
      background: var(--panel);
      border: 1px solid var(--emerald);
      border-radius: 14px;
      padding: 20px 22px;
      display: none;
    }

    .result-box h2 { color: var(--gold); font-size: 1.18rem; margin-bottom: 8px; }
    .score-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin: 12px 0;
    }

    .score-item {
      background: rgba(2, 6, 23, 0.85);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    .score-item span { display: block; font-size: 0.78rem; color: var(--muted); }
    .score-item strong { font-size: 1.12rem; color: var(--emerald); }

    .actions-bottom {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <h1>3-BOB KIRUVCHI TEST — 11-SINF ASTRONOMIYA</h1>
    <p>Astrofizika va tadqiqot metodlari (28–33-§§ oldidan tayanch bilimlar) | A/B Variant (20 savoldan)</p>
  </div>
  <div class="mode-tabs">
    <button class="tab-btn active" id="tabA" onclick="switchMode('A')">A Variant (20 savol)</button>
    <button class="tab-btn" id="tabB" onclick="switchMode('B')">B Variant (20 savol)</button>
  </div>
  <div class="status-bar">
    <div class="pill" id="answeredPill">Javoblar: 0 / 20</div>
    <button class="btn" onclick="gradeExam()">Yakunlash va baholash</button>
    <button class="btn secondary" onclick="resetExam()">Qayta boshlash</button>
  </div>
</header>

<div class="container">
  <div class="meta-card">
    <div>
      <label for="stName">O‘quvchining F.I.Sh.:</label>
      <input type="text" id="stName" placeholder="Masalan: Karimov Azizbek" />
    </div>
    <div>
      <label for="stClass">Sinf va maktab:</label>
      <input type="text" id="stClass" placeholder="Masalan: 11-«A» sinf" />
    </div>
    <div>
      <label for="stDate">Sana:</label>
      <input type="text" id="stDate" value="2026-11-26" />
    </div>
  </div>

  <div id="resultBox" class="result-box">
    <h2 id="resTitle">3-Bob Kiruvchi Test Natijasi</h2>
    <p id="resStudent" style="color: var(--muted); font-size: 0.88rem;"></p>
    <div class="score-grid">
      <div class="score-item"><span>To‘g‘ri javoblar</span><strong id="resCorrect">0 / 20</strong></div>
      <div class="score-item"><span>Foiz ko‘rsatkichi</span><strong id="resPercent">0%</strong></div>
      <div class="score-item"><span>Tayyorgarlik darajasi</span><strong id="resGrade">—</strong></div>
    </div>
    <p id="resAdvice" style="font-size: 0.86rem; color: #cbd5e1;"></p>
  </div>

  <div id="questionsList" style="display:flex; flex-direction:column; gap:14px;"></div>

  <div class="actions-bottom">
    <button class="btn" onclick="gradeExam()">Yakunlash va baholash</button>
    <button class="btn secondary" onclick="resetExam()">Qayta boshlash</button>
  </div>
</div>

<script>
  const variantA = [
    { sec: "Fizika: Elektromagnit shkala", q: "1. Elektromagnit to‘lqinlar shkalasida to‘lqin uzunligi qisqargan sari foton (kvant) energiyasi qanday o‘zgaradi?", opts: ["Ortiqroq bo‘ladi (ortadi)", "Kamayadi", "O‘zgarmaydi", "Nolga teng bo‘ladi"], ans: 0, exp: "E = h·c / λ bo‘lgani uchun to‘lqin uzunligi λ kichiklashgan sari energiya E ortadi." },
    { sec: "Fizika: Elektromagnit shkala", q: "2. Quyidagi elektromagnit nurlanish turlaridan qaysi birining to‘lqin uzunligi eng katta?", opts: ["Radioto‘lqinlar", "Ko‘rinadigan yorug‘lik", "Ultrabinafsha nurlar", "Rentgen nurlari"], ans: 0, exp: "Elektromagnit shkala bo‘yicha radioto‘lqinlar eng uzun, gamma/rentgen nurlari esa eng qisqa to‘lqin uzunligiga ega." },
    { sec: "Fizika: Elektromagnit shkala", q: "3. Inson ko‘zi qabul qila oladigan ko‘rinadigan yorug‘lik to‘lqin uzunliklari taxminan qaysi oraliqda yotadi?", opts: ["≈ 380–750 nm", "≈ 1–10 m", "≈ 0.01–1 nm", "≈ 100–1000 km"], ans: 0, exp: "Binafsha rang ~380–400 nm atrofida, qizil rang esa ~700–750 nm atrofida joylashgan." },
    { sec: "Fizika: To‘lqin tenglamasi", q: "4. Vakuumda yorug‘lik tezligi c = 3 × 10⁸ m/s. Agar to‘lqin uzunligi λ = 0.5 × 10⁻⁶ m (500 nm) bo‘lsa, chastota (ν) qanday topiladi?", opts: ["ν = c / λ", "ν = c · λ", "ν = λ / c", "ν = c + λ"], ans: 0, exp: "c = λ · ν munosabatidan ν = c / λ." },
    { sec: "Birliklar: Nanometr", q: "5. 1 nanometr (1 nm) necha metrga teng?", opts: ["10⁻⁹ m (0.000000001 m)", "10⁻³ m", "10⁻⁶ m", "10⁹ m"], ans: 0, exp: "«Nano-» old qo‘shimchasi 10⁻⁹ ulushni anglatadi: 1 nm = 10⁻⁹ m." },
    { sec: "Birliklar: Mikrometr", q: "6. 1 mikrometr (1 mkm) necha nanometrga teng?", opts: ["1 000 nm", "10 nm", "0.001 nm", "100 nm"], ans: 0, exp: "1 mkm = 10⁻⁶ m, 1 nm = 10⁻⁹ m ⇒ 10⁻⁶ / 10⁻⁹ = 1000 nm." },
    { sec: "Fizika: Geometriya optika", q: "7. Yig‘uvchi linzaning fokus masofasi F = 20 sm bo‘lsa, uning optik kuchi (D = 1 / F, metrda) nechaga teng?", opts: ["5 dptr", "0.05 dptr", "20 dptr", "2 dptr"], ans: 0, exp: "F = 20 sm = 0.2 m ⇒ D = 1 / 0.2 = 5 dioptriya." },
    { sec: "Fizika: Geometriya optika", q: "8. Botiq sferik yoki parabolik ko‘zgu parallel tushgan yorug‘lik nurlarini qanday yo‘naltiradi?", opts: ["Bitta nuqtaga — fokusga yig‘adi", "Har tomonga sochib yuboradi", "Umuman qaytarmaydi", "Faqat orqaga qaytaradi"], ans: 0, exp: "Botiq ko‘zgu nurlarni fokusda jamlab, yorug‘lik oqimini kuchaytiradi." },
    { sec: "Fizika: Teleskop asoslari", q: "9. Teleskop obyektivining diametri (D) kattalashishi birinchi navbatda nimani oshiradi?", opts: ["Yig‘iladigan yorug‘lik miqdorini (ravshanlikni) va burchak ajrata olish qobiliyatini", "Faqat teleskopning og‘irligini", "Okulyar fokus masofasini", "Yerning aylanish tezligini"], ans: 0, exp: "Katta obyektiv ko‘proq foton to‘plab xira obyektlarni ko‘rishga va mayda detallarni ajratishga imkon beradi." },
    { sec: "Fizika: Teleskop asoslari", q: "10. Teleskopning kattalashtirishi Γ = F_ob / F_ok formulasiga ko‘ra, agar obyektiv fokus masofasi 120 sm, okulyarniki 4 sm bo‘lsa, kattalashtirish necha marta?", opts: ["30 marta", "480 marta", "124 marta", "0.03 marta"], ans: 0, exp: "Γ = 120 / 4 = 30 marta." },
    { sec: "Fizika: Dispersiya", q: "11. Oq yorug‘lik prizmadan o‘tganda spektrga ajralishida qaysi rang eng kuchli sinadi?", opts: ["Binafsha rang", "Qizil rang", "Sariq rang", "Yashil rang"], ans: 0, exp: "Qisqa to‘lqinli (binafsha) nur uchun sindirish ko‘rsatkichi kattaroq bo‘lgani uchun u ko‘proq og‘adi." },
    { sec: "Fizika: Spektr turlari", q: "12. Cho‘g‘langan qattiq jism yoki juda zich gaz chiqaradigan, barcha ranglar uzluksiz ketma-ket keladigan spektr qanday ataladi?", opts: ["Uzluksiz spektr", "Chiziqli yutilish spektri", "Yorqin chiziqli spektr", "Diskret spektr"], ans: 0, exp: "Qizdirilgan zich jismlar uzluksiz spektr beradi." },
    { sec: "Fizika: Spektr turlari", q: "13. Sovuqroq gaz orqali o‘tgan uzluksiz spektrda paydo bo‘ladigan qorong‘u chiziqlar nimani bildiradi?", opts: ["Gaz atomlari o‘ziga xos to‘lqin uzunliklaridagi fotonlarni yutganini", "Yorug‘likning to‘liq yo‘qolganini", "Ko‘zguning sinishini", "Teleskopning noto‘g‘ri o‘rnatilganini"], ans: 0, exp: "Yutilish chiziqlari o‘rni va soni moddaning kimyoviy tarkibini aniqlashga yordam beradi." },
    { sec: "Fizika: Issiqlik nurlanishi", q: "14. Jism temperaturasi oshgan sari uning issiqlik nurlanishi maksimal intensivligiga mos to‘lqin uzunligi (λ_max) qanday o‘zgaradi?", opts: ["Qisqa to‘lqinlar (ko‘k/ultrabinafsha) tomonga siljiydi", "Uzun to‘lqinlar (qizil/infraqizil) tomonga siljiydi", "O‘zgarmaydi", "Nolga aylanadi"], ans: 0, exp: "Temperatura oshganda nurlanish maksimumi qisqaroq to‘lqin uzunligiga siljiydi (Vin qonuni)." },
    { sec: "Yer atmosferasi", q: "15. Yer atmosferasi qaysi elektromagnit nurlanish turlarining yer sirtiga to‘liq o‘tishiga to‘sqinlik qiladi?", opts: ["Rentgen, gamma, ko‘p qism ultrabinafsha va ayrim infraqizil/radioto‘lqinlarning", "Faqat ko‘rinadigan yorug‘likning", "Hech qaysi nurlanishga to‘sqinlik qilmaydi", "Faqat magnit maydonning"], ans: 0, exp: "Atmosfera qatlamlari (ozon, suv bug‘i, kislorod, ionosfera) ko‘plab diapazonlarni yutadi yoki qaytaradi." },
    { sec: "Amaliy hisob", q: "16. Agar ikki teleskop obyektivining diametri 10 sm va 50 sm bo‘lsa, ikkinchisining yorug‘lik yig‘ish yuzasi (S ~ D²) birinchisidan necha marta katta?", opts: ["25 marta", "5 marta", "10 marta", "50 marta"], ans: 0, exp: "Yuza diametr kvadratiga proporsional: (50 / 10)² = 5² = 25 marta." },
    { sec: "Amaliy vaziyat", q: "17. Nima sababdan kosmik teleskoplar (masalan, Hubble yoki James Webb) Yer orbitasiga chiqariladi?", opts: ["Yer atmosferasi xiralashtirishini va yutilishini bartaraf etib, tiniq tasvir va keng diapazon olish uchun", "Gravitatsiyani 100 marta oshirish uchun", "Quyosh nurini o‘chirish uchun", "Yoqilg‘i tejash maqsadida"], ans: 0, exp: "Kosmosda atmosfera bo‘lmagani uchun tasvir sifati keskin oshadi va yutiladigan nurlanishlar kuzatiladi." },
    { sec: "Amaliy vaziyat", q: "18. Agar biror jismning spektrida vodorodga xos yutilish chiziqlari aniqlansa, bu nimadan dalolat beradi?", opts: ["Jism muhitida (yoki uning atmosferasida) vodorod atomlari mavjudligidan", "Jism faqat temirdan iboratligidan", "Teleskopda xato borligidan", "Yulduzning yoshi 1 yil ekanligidan"], ans: 0, exp: "Har bir kimyoviy element o‘ziga xos spektral chiziqlar «barmoq izi»ga ega." },
    { sec: "Tayanch mantiq", q: "19. Kattalashtirishi juda katta (masalan, 500×), lekin obyektiv diametri juda kichik (masalan, 3 sm) teleskopda xira yulduzni ko‘rishda qanday muammo bo‘ladi?", opts: ["Yorug‘lik yetarli yig‘ilmagani va tasvir xiralashgani sababli yulduz xira/noaniq ko‘rinadi", "Yulduz 1000 marta kattalashib ketadi", "Teleskop o‘z-o‘zidan aylanadi", "Hech qanday muammo bo‘lmaydi"], ans: 0, exp: "«Bo‘sh kattalashtirish» foyda bermaydi — asosiy ko‘rsatkich obyektiv diametridir." },
    { sec: "Tayanch mantiq", q: "20. Nima sababdan astronomiyada faqat ko‘rinadigan yorug‘lik emas, balki radio, infraqizil va rentgen nurlanishlari ham o‘rganiladi?", opts: ["Turli fizik jarayonlar va sovuq/qaynoq obyektlar o‘z energiyasini spektrning turli sohalarida chiqaradi", "Inson ko‘zi faqat radioto‘lqinlarni ko‘radi", "Ko‘rinadigan yorug‘lik kosmosda tarqalmaydi", "Radio nurlanish faqat tushda bo‘ladi"], ans: 0, exp: "Masalan, sovuq gaz bulutlari infraqizil/radioto‘lqinda, o‘ta qizigan gaz esa rentgen nurlarida yaxshi ko‘rinadi." }
  ];

  const variantB = [
    { sec: "Fizika: Elektromagnit shkala", q: "1. Elektromagnit to‘lqinlar shkalasida to‘lqin uzunligi ortgan sari chastota (ν) qanday o‘zgaradi?", opts: ["Kamayadi (teskari proporsional)", "Ortadi", "O‘zgarmaydi", "Cheksiz ortadi"], ans: 0, exp: "c = λ · ν bo‘lgani uchun λ kattalashganda ν kamayadi." },
    { sec: "Fizika: Elektromagnit shkala", q: "2. Quyidagi nurlanish turlaridan qaysi birining to‘lqin uzunligi eng qisqa?", opts: ["Gamma / Rentgen nurlari", "Mikroto‘lqinlar", "Infraqizil nurlar", "Radioto‘lqinlar"], ans: 0, exp: "Gamma va rentgen nurlari elektromagnit shkalaning eng qisqa to‘lqinli (yuqori energiyali) qismidadir." },
    { sec: "Fizika: Elektromagnit shkala", q: "3. Ko‘rinadigan spektrda qizil rangning to‘lqin uzunligi binafsha rangnikiga nisbatan qanday?", opts: ["Kattaroq (uzunroq)", "Kichikroq (qisqaroq)", "Bir xil", "Nolga teng"], ans: 0, exp: "Qizil nur ~700–750 nm atrofida, binafsha nur esa ~380–400 nm atrofidadir." },
    { sec: "Fizika: To‘lqin tenglamasi", q: "4. Yorug‘lik tezligi c = λ · ν formulasi bo‘yicha chastota ν = 6 × 10¹⁴ Gs va to‘lqin uzunligi λ = 5 × 10⁻⁷ m bo‘lsa, c nechaga teng?", opts: ["3 × 10⁸ m/s", "1.2 × 10²¹ m/s", "1.2 × 10⁷ m/s", "3 × 10⁶ m/s"], ans: 0, exp: "c = (5 × 10⁻⁷) × (6 × 10¹⁴) = 30 × 10⁷ = 3 × 10⁸ m/s." },
    { sec: "Birliklar: Nanometr", q: "5. 600 nanometr (600 nm) to‘lqin uzunligi metrlarda qanday ifodalanadi?", opts: ["600 × 10⁻⁹ m (6 × 10⁻⁷ m)", "600 × 10⁻³ m", "600 × 10⁹ m", "600 × 10⁻² m"], ans: 0, exp: "1 nm = 10⁻⁹ m ⇒ 600 nm = 600 × 10⁻⁹ m = 6 × 10⁻⁷ m." },
    { sec: "Birliklar: Mikrometr", q: "6. 5 mikrometr (5 mkm) necha nanometrga teng?", opts: ["5 000 nm", "50 nm", "0.5 nm", "500 nm"], ans: 0, exp: "1 mkm = 1000 nm ⇒ 5 mkm = 5 × 1000 = 5000 nm." },
    { sec: "Fizika: Geometriya optika", q: "7. Optik kuchi D = 2 dptr bo‘lgan yig‘uvchi linzaning fokus masofasi (F) nechaga teng?", opts: ["0.5 m (50 sm)", "2 m", "0.2 m", "5 m"], ans: 0, exp: "F = 1 / D = 1 / 2 = 0.5 m = 50 sm." },
    { sec: "Fizika: Geometriya optika", q: "8. Linzali teleskop (refraktor) da yorug‘lik nurlari obyektivdan o‘tganda qanday hodisa ro‘y beradi?", opts: ["Yorug‘likning sinishi (refraksiyasi)", "Yorug‘likning to‘liq yutilishi", "Tovushning qaytishi", "Elektr zaryadlanishi"], ans: 0, exp: "Linza shisha muhiti yorug‘likni sindirib, fokusda tasvir hosil qiladi." },
    { sec: "Fizika: Teleskop asoslari", q: "9. Teleskopning burchak ajrata olish qobiliyati yaxshilanishi nimani anglatadi?", opts: ["Osmondagi bir-biriga juda yaqin joylashgan ikki nuqta/yulduzni alohida-alohida ko‘ra olishni", "Jism massasini oshirishni", "Kun uzunligini o‘zgartirishni", "Teleskopni rangsizlantirishni"], ans: 0, exp: "Kattagina obyektiv kichik burchak ostidagi detallarni ajratib ko‘rsata oladi." },
    { sec: "Fizika: Teleskop asoslari", q: "10. Agar teleskop 40 marta kattalashtirsa va okulyar fokus masofasi 5 sm bo‘lsa, obyektiv fokus masofasi (F_ob = Γ · F_ok) qancha?", opts: ["200 sm (2 m)", "8 sm", "45 sm", "35 sm"], ans: 0, exp: "F_ob = 40 × 5 sm = 200 sm = 2 m." },
    { sec: "Fizika: Dispersiya", q: "11. Oq yorug‘lik prizmadan o‘tganda qaysi rang eng kam sinadi?", opts: ["Qizil rang", "Binafsha rang", "Ko‘k rang", "Binafsha-ko‘k rang"], ans: 0, exp: "Eng uzun to‘lqinli qizil nur prizmada eng kam og‘adi." },
    { sec: "Fizika: Spektr turlari", q: "12. Siyraklashgan cho‘g‘langan gaz chiqaradigan, qora fonda alohida yorqin chiziqlardan iborat spektr qanday ataladi?", opts: ["Chiziqli emissiya (nurlanish) spektri", "Uzluksiz spektr", "Yutilish spektri", "Issiqlik spektri"], ans: 0, exp: "Uyg‘onish holatidagi siyrak gaz atomlari o‘ziga xos to‘lqin uzunliklarida yorqin chiziqlar chiqaradi." },
    { sec: "Fizika: Spektr turlari", q: "13. Spektral chiziqlarning o‘rtacha holatiga nisbatan siljishi (Doppler effekti) nimani aniqlashga yordam beradi?", opts: ["Yorug‘lik manbaining kuzatuvchiga yaqinlashish yoki uzoqlashish tezligini", "Jismning rangini o‘zgartirishni", "Linza qalinligini", "Oyning yoshini"], ans: 0, exp: "Manba harakati spektr chiziqlarining to‘lqin uzunligini o‘zgartiradi." },
    { sec: "Fizika: Issiqlik nurlanishi", q: "14. Agar jismning temperaturasi pasaysa, uning issiqlik nurlanishi qaysi soha tomonga siljiydi?", opts: ["Uzunroq to‘lqinlar (qizil / infraqizil) tomonga", "Qisqaroq to‘lqinlar (ultrabinafsha) tomonga", "O‘zgarmaydi", "Gamma sohaga"], ans: 0, exp: "Sovigan sari nurlanish maksimumi uzunroq to‘lqin uzunligiga siljiydi." },
    { sec: "Yer atmosferasi", q: "15. Yer sirtidan turib kuzatishda radioto‘lqinlarning qaysi qismi atmosferadan o‘tib, radioteleskoplar bilan qabul qilinadi?", opts: ["Optik oyna va radiooyna diapazonidagi to‘lqinlar (taxminan ~1 sm dan ~10–20 m gacha)", "Barcha gamma va rentgen nurlari", "Faqat ultrabinafsha nurlar", "Hech qanday radioto‘lqin o‘tmaydi"], ans: 0, exp: "Yer atmosferasida ko‘rinadigan yorug‘lik va ma’lum radioto‘lqinlar uchun «oyna» mavjud." },
    { sec: "Amaliy hisob", q: "16. Agar ikki teleskop obyektivining diametri 20 sm va 60 sm bo‘lsa, kattaroq obyektivning yuzasi kichiginikidan necha marta katta?", opts: ["9 marta", "3 marta", "6 marta", "12 marta"], ans: 0, exp: "Yuzalar nisbati diametrlar kvadratining nisbatiga teng: (60 / 20)² = 3² = 9 marta." },
    { sec: "Amaliy vaziyat", q: "17. Nima sababdan juda katta ko‘zguli teleskoplarda (reflektorlarda) ulkan yaxlit linza o‘rniga ko‘zgu ishlatish qulayroq?", opts: ["Katta linza o‘z og‘irligidan deformatsiyalanadi va xromatik aberratsiya beradi, ko‘zgu esa faqat old sirtidan qaytaradi", "Ko‘zgu yorug‘likni umuman qaytarmaydi", "Linza faqat qorong‘ida ishlaydi", "Ko‘zgu hech qanday vaznga ega emas"], ans: 0, exp: "Katta linzalarni yasash va tayanchlash qiyinroq; ko‘zgu esa rang xatoligisiz nur yig‘adi." },
    { sec: "Amaliy vaziyat", q: "18. Agar biror yulduzning sirt temperaturasi boshqasinikiga qaraganda ancha yuqori bo‘lsa, u ko‘proq qaysi rangda nurlanadi?", opts: ["Ko‘k / oqish-ko‘k tusda", "To‘q qizil tusda", "Faqat qora rangda", "Faqat yashil nuqta shaklida"], ans: 0, exp: "Yuqori temperaturali yulduzlar qisqa to‘lqinli (ko‘k) diapazonda kuchliroq nurlanadi." },
    { sec: "Tayanch mantiq", q: "19. Teleskopda tasvirni kuzatish uchun nega obyektiv bilan birga okulyar ham ishlatiladi?", opts: ["Obyektiv hosil qilgan haqiqiy tasvirni ko‘z bilan qulay ko‘rish va burchak kattalashuvini oshirish uchun", "Teleskopni yerga mahkamlash uchun", "Batareyani quvvatlantirish uchun", "Yulduzlarni yaqinlashtirmaslik uchun"], ans: 0, exp: "Obyektiv tasvir hosil qiladi, okulyar esa lupa vazifasini bajarib tasvirni kattalashtiradi." },
    { sec: "Tayanch mantiq", q: "20. Nima sababdan astronomik kuzatuvda obyektning faqat ko‘rinishiga emas, balki uning spektriga ham tayaniladi?", opts: ["Spektr obyektning kimyoviy tarkibi, temperaturasi, zichligi va harakat tezligi haqida aniq ma’lumot beradi", "Spektr faqat ob-havoni ko‘rsatadi", "Teleskopda kamera bo‘lmaydi", "Spektr yulduz masofasini nolga tenglashtiradi"], ans: 0, exp: "Astrofizikaning asosiy quroli — spektral tahlil masofadan turib fizik xossalarni aniqlash imkonini beradi." }
  ];

  let currentMode = 'A';
  let userAnswersA = new Array(variantA.length).fill(null);
  let userAnswersB = new Array(variantB.length).fill(null);
  let gradedA = false;
  let gradedB = false;

  function getActiveQuestions() { return currentMode === 'B' ? variantB : variantA; }
  function getActiveAnswers() { return currentMode === 'B' ? userAnswersB : userAnswersA; }
  function isActiveGraded() { return currentMode === 'B' ? gradedB : gradedA; }
  function setActiveGraded(val) {
    if (currentMode === 'B') gradedB = val;
    else gradedA = val;
  }

  function switchMode(mode) {
    currentMode = mode;
    document.getElementById('tabA').classList.toggle('active', mode === 'A');
    document.getElementById('tabB').classList.toggle('active', mode === 'B');
    document.getElementById('resultBox').style.display = 'none';

    renderQuestions();
    updateAnsweredPill();
    if (isActiveGraded()) gradeExam();
  }

  function renderQuestions() {
    const qs = getActiveQuestions();
    const ansArr = getActiveAnswers();
    const list = document.getElementById('questionsList');
    list.innerHTML = '';

    qs.forEach((item, qIndex) => {
      const card = document.createElement('div');
      card.className = 'q-card';

      const top = document.createElement('div');
      top.className = 'q-top';
      top.innerHTML = `<span>${currentMode} Variant — ${item.sec}</span><span>Savol #${qIndex + 1}</span>`;

      const qText = document.createElement('div');
      qText.className = 'q-text';
      qText.textContent = item.q;

      const opts = document.createElement('div');
      opts.className = 'opts';

      const letters = ['A', 'B', 'C', 'D'];
      item.opts.forEach((opt, oIndex) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = `${letters[oIndex]}) ${opt}`;
        if (ansArr[qIndex] === oIndex) btn.classList.add('selected');
        btn.onclick = () => {
          if (isActiveGraded()) return;
          ansArr[qIndex] = oIndex;
          updateAnsweredPill();
          Array.from(opts.children).forEach((c, idx) => {
            c.classList.toggle('selected', idx === oIndex);
          });
        };
        opts.appendChild(btn);
      });

      const exp = document.createElement('div');
      exp.className = 'explain';
      exp.id = `exp-${currentMode}-${qIndex}`;
      exp.textContent = `Izoh: ${item.exp}`;

      card.appendChild(top);
      card.appendChild(qText);
      card.appendChild(opts);
      card.appendChild(exp);
      list.appendChild(card);
    });
  }

  function updateAnsweredPill() {
    const ansArr = getActiveAnswers();
    const count = ansArr.filter(x => x !== null).length;
    document.getElementById('answeredPill').textContent = `Javoblar: ${count} / ${ansArr.length}`;
  }

  function gradeExam() {
    setActiveGraded(true);
    const qs = getActiveQuestions();
    const ansArr = getActiveAnswers();
    let correct = 0;
    const cards = document.getElementById('questionsList').children;

    qs.forEach((item, qIndex) => {
      const opts = cards[qIndex].querySelectorAll('.opt-btn');
      opts.forEach((btn, oIndex) => {
        btn.classList.remove('selected', 'correct', 'wrong');
        if (oIndex === item.ans) {
          btn.classList.add('correct');
        } else if (ansArr[qIndex] === oIndex) {
          btn.classList.add('wrong');
        }
      });
      if (ansArr[qIndex] === item.ans) correct++;
      document.getElementById(`exp-${currentMode}-${qIndex}`).style.display = 'block';
    });

    const pct = Math.round((correct / qs.length) * 100);
    let level = "Boshlang‘ich (Tayanch mavzularni takrorlash zarur)";
    let advice = "Tavsiya: Elektromagnit to‘lqinlar shkalasi, c = λ·ν bog‘lanishi, linza/ko‘zgu optikasi, dispersiya va spektr turlari bo‘yicha tayanch bilimlarni takrorlang.";
    if (pct >= 86) {
      level = "Yuqori (5 — A'lo)";
      advice = "Ajoyib tayyorgarlik! 3-bob (Astrofizika va tadqiqot metodlari) mavzularini o‘zlashtirishga to‘liq tayyorsiz.";
    } else if (pct >= 71) {
      level = "Yaxshi (4 — Yaxshi)";
      advice = "Yaxshi natija! Xato tushgan savollarning izohini ko‘rib, teleskoplar va spektral tahlil mavzulariga bemalol o‘ting.";
    } else if (pct >= 55) {
      level = "O‘rta (3 — Qoniqarli)";
      advice = "O‘rta daraja. To‘lqin uzunligi birliklari (nm, mkm) va optik kattaliklar nisbatlarini mustahkamlab oling.";
    }

    const name = document.getElementById('stName').value.trim() || "O‘quvchi";
    const cls = document.getElementById('stClass').value.trim();
    const dt = document.getElementById('stDate').value.trim();

    document.getElementById('resTitle').textContent = `3-Bob Kiruvchi Test Natijasi (${currentMode} Variant)`;
    document.getElementById('resStudent').textContent = `O‘quvchi: ${name}${cls ? ' — ' + cls : ''}${dt ? ' | Sana: ' + dt : ''}`;
    document.getElementById('resCorrect').textContent = `${correct} / ${qs.length}`;
    document.getElementById('resPercent').textContent = `${pct}%`;
    document.getElementById('resGrade').textContent = level;
    document.getElementById('resAdvice').textContent = advice;
    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });
  }

  function resetExam() {
    setActiveGraded(false);
    getActiveAnswers().fill(null);
    updateAnsweredPill();
    document.getElementById('resultBox').style.display = 'none';
    renderQuestions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  renderQuestions();
  updateAnsweredPill();
</script>
</body>
</html>
