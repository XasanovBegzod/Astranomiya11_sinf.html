<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>1-Mavzu Video Slayd (Ovozli) | 11-sinf Astronomiya</title>
  <style>
    :root {
      --bg: #040814;
      --accent: #38bdf8;
      --gold: #fbbf24;
      --emerald: #34d399;
      --text: #f8fafc;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 15%, #11224d 0%, var(--bg) 78%);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      overflow-x: hidden;
    }

    .top-bar {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 12px 18px;
      background: rgba(4, 8, 20, 0.9);
      border-bottom: 1px solid rgba(56, 189, 248, 0.25);
      gap: 10px;
      flex-wrap: wrap;
      z-index: 10;
    }

    .badge {
      font-size: 0.8rem;
      font-weight: 700;
      color: var(--accent);
      background: rgba(56, 189, 248, 0.14);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 4px 12px;
      border-radius: 20px;
    }

    .controls { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }

    button {
      background: linear-gradient(135deg, #0284c7, #1d4ed8);
      border: 1px solid #7dd3fc;
      color: #fff;
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 0.82rem;
      font-weight: 600;
      cursor: pointer;
    }

    button.secondary {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(148, 163, 184, 0.35);
    }

    button.active-toggle {
      background: rgba(16, 185, 129, 0.25);
      border-color: var(--emerald);
      color: #d1fae5;
    }

    .timer-pill {
      font-variant-numeric: tabular-nums;
      font-size: 0.85rem;
      font-weight: 700;
      color: var(--gold);
      padding: 6px 10px;
      background: rgba(15, 23, 42, 0.9);
      border: 1px solid rgba(251, 191, 36, 0.35);
      border-radius: 8px;
    }

    .stage {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px 20px;
      text-align: center;
      position: relative;
    }

    canvas {
      width: 100%;
      max-width: 560px;
      height: 240px;
      border-radius: 16px;
      background: rgba(7, 13, 31, 0.85);
      border: 1px solid rgba(56, 189, 248, 0.25);
      margin-bottom: 20px;
    }

    .slide-kicker {
      font-size: 0.82rem;
      text-transform: uppercase;
      letter-spacing: 1.5px;
      color: var(--gold);
      font-weight: 700;
      margin-bottom: 8px;
    }

    .slide-title {
      font-size: 1.7rem;
      font-weight: 800;
      max-width: 780px;
      line-height: 1.3;
      margin-bottom: 14px;
      background: linear-gradient(90deg, #ffffff, #bae6fd);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      animation: fadeUp 0.6s ease;
    }

    .slide-points {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 10px;
      max-width: 760px;
    }

    .point-chip {
      background: rgba(15, 23, 42, 0.88);
      border: 1px solid rgba(56, 189, 248, 0.35);
      padding: 10px 16px;
      border-radius: 12px;
      font-size: 0.96rem;
      font-weight: 600;
      color: #e2e8f0;
      animation: fadeUp 0.75s ease;
    }

    @keyframes fadeUp {
      from { opacity: 0; transform: translateY(14px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .progress-wrap {
      width: 100%;
      height: 5px;
      background: rgba(148, 163, 184, 0.2);
    }

    .progress-fill {
      height: 100%;
      width: 0%;
      background: linear-gradient(90deg, var(--accent), var(--emerald));
      transition: width 0.25s linear;
    }

    .teleprompter {
      background: rgba(9, 14, 29, 0.96);
      border-top: 1px solid rgba(56, 189, 248, 0.3);
      padding: 14px 20px;
      text-align: center;
    }

    .teleprompter small {
      display: block;
      color: var(--emerald);
      font-size: 0.75rem;
      font-weight: 700;
      margin-bottom: 4px;
      text-transform: uppercase;
    }

    .teleprompter p {
      max-width: 820px;
      margin: 0 auto;
      font-size: 1rem;
      color: #f1f5f9;
      line-height: 1.55;
    }

    @media (max-width: 600px) {
      .slide-title { font-size: 1.32rem; }
      canvas { height: 190px; }
    }
  </style>
</head>
<body>

  <div class="top-bar">
    <span class="badge">11-sinf Astronomiya • 1-mavzu (1-§)</span>
    <div class="controls">
      <span class="timer-pill" id="timerDisplay">00:00 / 03:00</span>
      <button id="playBtn" onclick="togglePlay()">▶ Boshlash</button>
      <button class="secondary" onclick="prevSlide()">◀</button>
      <button class="secondary" onclick="nextSlide()">▶</button>
      <button id="ttsBtn" class="active-toggle" onclick="toggleTTS()">🔊 Avto-ovoz: ON</button>
      <button id="musicBtn" class="active-toggle" onclick="toggleMusic()">🎵 Fon: ON</button>
      <button class="secondary" onclick="togglePrompt()">Matnni yashirish</button>
    </div>
  </div>

  <div class="stage">
    <canvas id="astroCanvas" width="700" height="300"></canvas>
    <div class="slide-kicker" id="slideKicker">1 / 4 — KIRISH</div>
    <h1 class="slide-title" id="slideTitle">Astronomiya nimani o‘rganadi?</h1>
    <div class="slide-points" id="slidePoints"></div>
  </div>

  <div>
    <div class="progress-wrap"><div class="progress-fill" id="progressFill"></div></div>
    <div class="teleprompter" id="teleprompterBox">
      <small>Diktor matni (Avtomatik o‘qiladi):</small>
      <p id="scriptText"></p>
    </div>
  </div>

  <script>
    const slides = [
      {
        duration: 40,
        kicker: "1 / 4 • KIRISH SAVOLI",
        title: "Astronomiya nimani o‘rganadi?",
        points: ["🌌 Koinot sirlari", "⏳ Ming yillik kuzatuvlar", "🧭 Vaqt va yo‘nalish"],
        script: "Salom, 11-sinf o‘quvchisi! Hech o‘ylab ko‘rganmisiz, nega insoniyat ming yillar davomida osmon jismlarini kuzatishga shunchalik katta e’tibor qaratgan? Bugun biz astronomiya fanining maqsadi, uning o‘tmishi va boshqa fanlar bilan bog‘liqligi haqida gaplashamiz.",
        scene: "stars"
      },
      {
        duration: 50,
        kicker: "2 / 4 • FANNING PREDMETI",
        title: "«Astron» — yulduz, «Nomos» — qonun",
        points: ["🪐 Sayyoralar va yo‘ldoshlar", "⭐ Yulduzlar va galaktikalar", "🔭 Koinot tuzilishi va harakati"],
        script: "«Astronomiya» so‘zi yunoncha «astron» — yulduz va «nomos» — qonun so‘zlaridan olingan. Bu fan sayyoralar, yulduzlar, galaktikalar va umuman Koinotning tuzilishi, harakati, kelib chiqishi hamda rivojlanishini o‘rganadi. Oddiy qilib aytganda, astronomiya — tabiatdagi eng ulkan laboratoriyadagi jarayonlarni tushunish kaliti.",
        scene: "orbit"
      },
      {
        duration: 45,
        kicker: "3 / 4 • TARAQQIYOT BOSQICHLARI",
        title: "Qadimgi kuzatuvlardan kosmik eragacha",
        points: ["👁️ Oddiy ko‘z bilan kuzatish", "🏛️ Rasadxonalar va teleskoplar", "🚀 Kosmonavtika va sun’iy yo‘ldoshlar"],
        script: "Qadimda odamlar vaqtni bilish, ekin ekish va safarlarda yo‘nalish topish uchun osmonga qaragan. Keyinchalik rasadxonalar qurildi, teleskop kashf etildi, XX asrda esa astrofizika va kosmonavtika rivojlanib, insoniyat bevosita kosmosga chiqdi.",
        scene: "telescope"
      },
      {
        duration: 45,
        kicker: "4 / 4 • FANLAR ALOQASI VA XULOSA",
        title: "Astronomiya va boshqa fanlar",
        points: ["⚛️ Fizika qonunlari", "📐 Matematika hisoblari", "🌍 Geografiya va vaqt"],
        script: "Astronomiya yakka o‘zi rivojlanmaydi: u fizika qonunlariga tayanadi, matematik hisob-kitoblardan foydalanadi, geografiya bilan koordinata va vaqt masalalarida tutashadi. Xulosa qilib aytganda, astronomiya bizga o‘zimiz yashayotgan dunyoning kengligini ko‘rsatadi. Keyingi darsda yoritgichlarning sutkalik harakatini ko‘ramiz!",
        scene: "network"
      }
    ];

    const totalDuration = slides.reduce((s, x) => s + x.duration, 0);
    let elapsed = 0;
    let playing = false;
    let intervalId = null;
    let ttsEnabled = true;
    let musicEnabled = true;

    // Web Audio API — sokin kosmik fon musiqasi
    let audioCtx = null;
    let masterGain = null;
    let musicStarted = false;

    function initAmbientMusic() {
      if (musicStarted) return;
      const AudioContext = window.AudioContext || window.webkitAudioContext;
      if (!AudioContext) return;
      audioCtx = new AudioContext();
      masterGain = audioCtx.createGain();
      masterGain.gain.value = musicEnabled ? 0.045 : 0;
      masterGain.connect(audioCtx.destination);

      const freqs = [110, 164.81, 220, 329.63];
      freqs.forEach((f, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.type = idx % 2 === 0 ? 'sine' : 'triangle';
        osc.frequency.value = f;
        gain.gain.value = 0.25 / freqs.length;
        osc.connect(gain);
        gain.connect(masterGain);
        osc.start();
      });
      musicStarted = true;
    }

    function updateMusicGain() {
      if (masterGain && audioCtx) {
        if (audioCtx.state === 'suspended') audioCtx.resume();
        masterGain.gain.setTargetAtTime(playing && musicEnabled ? 0.045 : 0, audioCtx.currentTime, 0.2);
      }
    }

    function toggleMusic() {
      musicEnabled = !musicEnabled;
      const btn = document.getElementById('musicBtn');
      btn.textContent = musicEnabled ? '🎵 Fon: ON' : '🔇 Fon: OFF';
      btn.classList.toggle('active-toggle', musicEnabled);
      btn.classList.toggle('secondary', !musicEnabled);
      updateMusicGain();
    }

    // Avtomatik ovoz (Text-to-Speech)
    function speakText(text) {
      if (!('speechSynthesis' in window)) return;
      window.speechSynthesis.cancel();
      if (!ttsEnabled || !playing) return;

      const utter = new SpeechSynthesisUtterance(text);
      const voices = window.speechSynthesis.getVoices();
      const uzVoice = voices.find(v => v.lang.toLowerCase().includes('uz')) ||
                      voices.find(v => v.lang.toLowerCase().includes('tr')) ||
                      voices.find(v => v.lang.toLowerCase().includes('ru'));
      if (uzVoice) utter.voice = uzVoice;
      utter.lang = uzVoice ? uzVoice.lang : 'uz-UZ';
      utter.rate = 0.96;
      utter.pitch = 1.0;
      window.speechSynthesis.speak(utter);
    }

    function toggleTTS() {
      ttsEnabled = !ttsEnabled;
      const btn = document.getElementById('ttsBtn');
      btn.textContent = ttsEnabled ? '🔊 Avto-ovoz: ON' : '🔈 Avto-ovoz: OFF';
      btn.classList.toggle('active-toggle', ttsEnabled);
      btn.classList.toggle('secondary', !ttsEnabled);
      if (!ttsEnabled && 'speechSynthesis' in window) {
        window.speechSynthesis.cancel();
      } else if (playing) {
        speakText(slides[getCurrentSlideIndex()].script);
      }
    }

    function formatTime(sec) {
      const m = String(Math.floor(sec / 60)).padStart(2, '0');
      const s = String(Math.floor(sec % 60)).padStart(2, '0');
      return `${m}:${s}`;
    }

    function getCurrentSlideIndex() {
      let acc = 0;
      for (let i = 0; i < slides.length; i++) {
        acc += slides[i].duration;
        if (elapsed < acc) return i;
      }
      return slides.length - 1;
    }

    let lastIdx = -1;
    function updateUI(forceSpeak = false) {
      const idx = getCurrentSlideIndex();
      if (idx !== lastIdx) {
        lastIdx = idx;
        const s = slides[idx];
        document.getElementById('slideKicker').textContent = s.kicker;
        document.getElementById('slideTitle').textContent = s.title;
        document.getElementById('scriptText').textContent = s.script;

        const pts = document.getElementById('slidePoints');
        pts.innerHTML = '';
        s.points.forEach(p => {
          const div = document.createElement('div');
          div.className = 'point-chip';
          div.textContent = p;
          pts.appendChild(div);
        });

        if (playing) speakText(s.script);
      } else if (forceSpeak && playing) {
        speakText(slides[idx].script);
      }

      document.getElementById('timerDisplay').textContent = `${formatTime(elapsed)} / ${formatTime(totalDuration)}`;
      document.getElementById('progressFill').style.width = `${(elapsed / totalDuration) * 100}%`;
    }

    function togglePlay() {
      playing = !playing;
      document.getElementById('playBtn').textContent = playing ? '⏸ Pauza' : '▶ Boshlash';

      if (playing) {
        initAmbientMusic();
        updateMusicGain();
        if (elapsed >= totalDuration) {
          elapsed = 0;
          lastIdx = -1;
        }
        updateUI(true);
        intervalId = setInterval(() => {
          elapsed += 0.25;
          if (elapsed >= totalDuration) {
            elapsed = totalDuration;
            playing = false;
            document.getElementById('playBtn').textContent = '↻ Qayta';
            updateMusicGain();
            if ('speechSynthesis' in window) window.speechSynthesis.cancel();
            clearInterval(intervalId);
          }
          updateUI(false);
        }, 250);
      } else {
        clearInterval(intervalId);
        updateMusicGain();
        if ('speechSynthesis' in window) window.speechSynthesis.cancel();
      }
    }

    function jumpToSlide(targetIdx) {
      let acc = 0;
      for (let i = 0; i < targetIdx; i++) acc += slides[i].duration;
      elapsed = acc;
      lastIdx = -1;
      updateUI(true);
    }

    function nextSlide() {
      const idx = getCurrentSlideIndex();
      if (idx < slides.length - 1) jumpToSlide(idx + 1);
    }

    function prevSlide() {
      const idx = getCurrentSlideIndex();
      if (idx > 0) jumpToSlide(idx - 1);
    }

    function togglePrompt() {
      const box = document.getElementById('teleprompterBox');
      box.style.display = box.style.display === 'none' ? 'block' : 'none';
    }

    // Canvas animatsiya
    const canvas = document.getElementById('astroCanvas');
    const ctx = canvas.getContext('2d');
    const bgStars = Array.from({ length: 55 }, () => ({
      x: Math.random() * canvas.width,
      y: Math.random() * canvas.height,
      r: Math.random() * 1.8 + 0.5
    }));

    let tick = 0;
    function draw() {
      tick += 0.02;
      ctx.clearRect(0, 0, canvas.width, canvas.height);

      bgStars.forEach(st => {
        ctx.beginPath();
        ctx.arc(st.x, st.y, st.r, 0, Math.PI * 2);
        ctx.fillStyle = `rgba(224, 242, 254, ${0.4 + 0.5 * Math.sin(tick * 2 + st.x)})`;
        ctx.fill();
      });

      const scene = slides[getCurrentSlideIndex()].scene;
      const cx = canvas.width / 2;
      const cy = canvas.height / 2;

      if (scene === 'stars') {
        const pts = [[220,190],[290,120],[360,145],[430,90],[490,160]];
        ctx.strokeStyle = 'rgba(56, 189, 248, 0.6)';
        ctx.lineWidth = 2;
        ctx.beginPath();
        pts.forEach((p, i) => i === 0 ? ctx.moveTo(p[0], p[1]) : ctx.lineTo(p[0], p[1]));
        ctx.stroke();
        pts.forEach(p => {
          ctx.beginPath();
          ctx.arc(p[0], p[1], 5, 0, Math.PI * 2);
          ctx.fillStyle = '#fbbf24';
          ctx.fill();
        });
      } else if (scene === 'orbit') {
        ctx.beginPath();
        ctx.arc(cx, cy, 24, 0, Math.PI * 2);
        ctx.fillStyle = '#fbbf24';
        ctx.fill();

        [65, 110].forEach((rad, i) => {
          ctx.beginPath();
          ctx.arc(cx, cy, rad, 0, Math.PI * 2);
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.35)';
          ctx.stroke();

          const ang = tick * (1.4 - i * 0.4);
          ctx.beginPath();
          ctx.arc(cx + Math.cos(ang) * rad, cy + Math.sin(ang) * rad, 7 + i * 2, 0, Math.PI * 2);
          ctx.fillStyle = i === 0 ? '#38bdf8' : '#34d399';
          ctx.fill();
        });
      } else if (scene === 'telescope') {
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 4;
        ctx.beginPath();
        ctx.arc(210, cy, 90, -0.7, 0.7);
        ctx.stroke();

        [-45, 0, 45].forEach(dy => {
          ctx.strokeStyle = 'rgba(251, 191, 36, 0.75)';
          ctx.lineWidth = 1.8;
          ctx.beginPath();
          ctx.moveTo(520, cy + dy);
          ctx.lineTo(295, cy + dy);
          ctx.lineTo(230, cy);
          ctx.stroke();
        });
        ctx.beginPath();
        ctx.arc(230, cy, 6, 0, Math.PI * 2);
        ctx.fillStyle = '#fbbf24';
        ctx.fill();
      } else {
        const nodes = [
          { x: cx, y: cy, label: 'ASTRONOMIYA', col: '#38bdf8', r: 34 },
          { x: cx - 170, y: cy - 55, label: 'FIZIKA', col: '#fbbf24', r: 24 },
          { x: cx + 170, y: cy - 55, label: 'MATEMATIKA', col: '#34d399', r: 24 },
          { x: cx, y: cy + 85, label: 'GEOGRAFIYA', col: '#fb7185', r: 24 }
        ];
        nodes.slice(1).forEach(n => {
          ctx.strokeStyle = 'rgba(148, 163, 184, 0.45)';
          ctx.lineWidth = 2;
          ctx.beginPath();
          ctx.moveTo(cx, cy);
          ctx.lineTo(n.x, n.y);
          ctx.stroke();
        });
        nodes.forEach(n => {
          ctx.beginPath();
          ctx.arc(n.x, n.y, n.r, 0, Math.PI * 2);
          ctx.fillStyle = n.col;
          ctx.fill();
          ctx.fillStyle = '#040814';
          ctx.font = 'bold 11px Segoe UI';
          ctx.textAlign = 'center';
          ctx.fillText(n.label, n.x, n.y + 4);
        });
      }

      requestAnimationFrame(draw);
    }

    if ('speechSynthesis' in window) {
      window.speechSynthesis.onvoiceschanged = () => window.speechSynthesis.getVoices();
    }

    updateUI(false);
    draw();
  </script>
</body>
</html>
