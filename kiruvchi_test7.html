<html lang="uz">
<head>
  <meta charset="UTF-8" />

  <title>7-Bo‘lim Kiruvchi Test | 11-sinf Astronomiya — Kosmonavtika elementlari</title>
  <style>
    :root {
      --bg: #050914;
      --panel: rgba(13, 21, 38, 0.94);
      --card: rgba(15, 23, 42, 0.88);
      --border: rgba(56, 189, 248, 0.28);
      --accent: #38bdf8;
      --gold: #fbbf24;
      --emerald: #34d399;
      --rose: #fb7185;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 0%, #0f1c38 0%, var(--bg) 80%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 13px 18px;
      background: rgba(5, 9, 20, 0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand h1 { font-size: 1.02rem; color: var(--accent); font-weight: 700; }
    .brand p { font-size: 0.78rem; color: var(--muted); }

    .mode-tabs { display: flex; gap: 6px; flex-wrap: wrap; }

    .tab-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.18s;
    }

    .tab-btn:hover { border-color: var(--accent); }
    .tab-btn.active {
      background: linear-gradient(135deg, #0284c7, #1d4ed8);
      border-color: #7dd3fc;
      color: #fff;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gold);
    }

    .btn {
      background: linear-gradient(135deg, #0284c7, #1d4ed8);
      border: 1px solid #7dd3fc;
      color: #fff;
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover { filter: brightness(1.12); }
    .btn.secondary {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(148, 163, 184, 0.35);
      color: var(--text);
    }

    .container {
      max-width: 980px;
      margin: 20px auto;
      padding: 0 16px 50px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .meta-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }

    .meta-card label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
    .meta-card input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(2, 6, 23, 0.85);
      color: var(--text);
      font-size: 0.88rem;
    }

    .q-card {
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 17px 20px;
    }

    .q-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 700;
    }

    .q-text {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
    }

    .opts { display: flex; flex-direction: column; gap: 8px; }

    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 10px 13px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(30, 41, 59, 0.82);
      color: var(--text);
      font-size: 0.88rem;
      cursor: pointer;
      transition: 0.16s;
    }

    .opt-btn:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.14); }
    .opt-btn.selected { border-color: var(--gold); background: rgba(251, 191, 36, 0.18); }
    .opt-btn.correct { border-color: var(--emerald); background: rgba(16, 185, 129, 0.25); color: #d1fae5; }
    .opt-btn.wrong { border-color: var(--rose); background: rgba(244, 63, 94, 0.25); color: #ffe4e6; }

    .explain {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(148, 163, 184, 0.25);
      font-size: 0.84rem;
      color: var(--emerald);
      display: none;
    }

    .result-box {
      background: var(--panel);
      border: 1px solid var(--emerald);
      border-radius: 14px;
      padding: 20px 22px;
      display: none;
    }

    .result-box h2 { color: var(--gold); font-size: 1.18rem; margin-bottom: 8px; }
    .score-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin: 12px 0;
    }

    .score-item {
      background: rgba(2, 6, 23, 0.85);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    .score-item span { display: block; font-size: 0.78rem; color: var(--muted); }
    .score-item strong { font-size: 1.12rem; color: var(--emerald); }

    .actions-bottom {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      margin-top: 6px;
    }
  </style>
</head>

<script>
  const variantA = [
    { sec: "Fizika: Impuls va Reaktiv harakat", q: "1. Kosmik bo‘shliqda (vakuumda) raketa tayanch muhit — havo bo‘lmasa ham qaysi fizik qonun tufayli tezlana oladi?", opts: ["Impulsning saqlanish qonuni (reaktiv harakat — yonish gazlari orqaga otilganda raketa oldinga siljiydi)", "Arximed itarib chiqarish kuchi tufayli", "Havo qarshiligi tufayli", "Magnit tortishishi tufayli"], ans: 0, exp: "Yopiq tizimda gazlar ma’lum impuls bilan orqaga chiqarilganda raketa qarama-qarshi tomonga teng impuls oladi." },
    { sec: "Fizika: Nyuton qonunlari", q: "2. Nyutonning 2-qonuniga ko‘ra (F = m · a), raketa dvigatelining tortish kuchi (F) o‘zgarmas bo‘lganda yoqilg‘i sarflanib raketa massasi (m) kamaygan sari tezlanish (a) qanday o‘zgaradi?", opts: ["Ortadi (tezlanish kuchayadi)", "Kamayadi", "O‘zgarmaydi", "Nolga teng bo‘ladi"], ans: 0, exp: "a = F / m bo‘lgani uchun massa m kamaygan sari tezlanish a ortib boradi." },
    { sec: "Fizika: Impuls", q: "3. Massasi m = 2 000 kg bo‘lgan kosmik apparat v = 8 km/s (8 000 m/s) tezlik bilan harakatlanmoqda. Uning impulsi (p = m · v) nechaga teng?", opts: ["1.6 × 10⁷ kg·m/s", "1.6 × 10⁴ kg·m/s", "4 kg·m/s", "2.5 × 10⁵ kg·m/s"], ans: 0, exp: "p = 2000 × 8000 = 16 000 000 = 1.6 × 10⁷ kg·m/s." },
    { sec: "Fizika: Energiya", q: "4. Kinetik energiya (E_k = m·v²/2) formulasiga ko‘ra, kosmik apparat tezligi 2 marta ortsa, uning kinetik energiyasi necha marta ortadi?", opts: ["4 marta", "2 marta", "8 marta", "O‘zgarmaydi"], ans: 0, exp: "Tezlik kvadratga bog‘liq bo‘lgani uchun (2v)² = 4v² ⇒ 4 marta ortadi." },
    { sec: "Fizika: Energiya saqlanishi", q: "5. Elliptik orbita bo‘ylab Yer atrofida aylanayotgan sun’iy yo‘ldosh Yerga eng yaqin nuqtaga (perigeyga) yaqinlashganda uning potensial energiyasi kamayadi; bunda kinetik energiyasi va tezligi qanday o‘zgaradi?", opts: ["Ortadi (perigeyda tezligi maksimal bo‘ladi)", "Kamayadi", "O‘zgarmaydi", "Nolga tushadi"], ans: 0, exp: "To‘liq mexanik energiya E = E_k + E_p = const saqlangani uchun E_p kamayganda E_k ortadi." },
    { sec: "Fizika: Kosmik tezliklar", q: "6. Yer sirti yaqinida birinchi kosmik tezlik (v₁) va ikkinchi kosmik tezlik (v₂) qiymatlarini to‘g‘ri ko‘rsating:", opts: ["v₁ ≈ 7.9 km/s, v₂ ≈ 11.2 km/s", "v₁ ≈ 11.2 km/s, v₂ ≈ 7.9 km/s", "v₁ ≈ 3.0 km/s, v₂ ≈ 30 km/s", "v₁ ≈ 340 m/s, v₂ ≈ 300 000 km/s"], ans: 0, exp: "v₁ = √(gR) ≈ 7.91 km/s; v₂ = √2 · v₁ ≈ 11.19 km/s." },
    { sec: "Fizika: Gravitatsiya", q: "7. Sun’iy yo‘ldosh Yer sirtidan balandroq orbitaga ko‘tarilganda uning aylana orbita bo‘ylab harakatlanish tezligi (v = √(GM/r)) qanday o‘zgaradi?", opts: ["Kamayadi (balandroq orbitada sekinroq aylanadi)", "Ortadi", "O‘zgarmaydi", "Yorug‘lik tezligiga yetadi"], ans: 0, exp: "Orbita radiusi r kattalashgan sari tortishish kuchi susayadi va aylana orbital tezlik kamayadi." },
    { sec: "Geometriya: Konus kesimlari", q: "8. Markaziy tortishish maydonida jismning boshlang‘ich tezligiga qarab qanday trayektoriyalar (konus kesimlari) yuzaga kelishi mumkin?", opts: ["Aylana, ellips, parabola va giperbola", "Kvadrat va uchburchak", "Sinusoida va spiral", "Faqat to‘g‘ri chiziq"], ans: 0, exp: "v = v₁ da aylana, v₁ < v < v₂ da ellips, v = v₂ da parabola, v > v₂ da giperbola hosil bo‘ladi." },
    { sec: "Geometriya: Ellips elementlari", q: "9. Yer sun’iy yo‘ldoshining elliptik orbitasida Yerga eng yaqin nuqta va eng uzoq nuqta qanday nomlanadi?", opts: ["Eng yaqin — perigey, eng uzoq — apogey", "Eng yaqin — perigeliy, eng uzoq — afeliy", "Eng yaqin — zenit, eng uzoq — nadir", "Eng yaqin — fokus, eng uzoq — ekvator"], ans: 0, exp: "Yer atrofidagi orbita uchun — perigey/apogey; Quyosh atrofidagi orbita uchun — perigeliy/afeliy." },
    { sec: "Fizika: Vaznsizlik", q: "10. Orbital stansiya (masalan, XKS) ichidagi kosmonavtlarda vaznsizlik holati yuzaga kelishining asosiy fizik sababi nima?", opts: ["Stansiya va kosmonavtlar Yerning tortishish maydonida bir xil tezlanish bilan uzluksiz erkin tushish holatida bo‘lishi", "400 km balandlikda Yerning tortishish kuchi butunlay nolga tengligi", "Stansiya ichida havo yo‘qligi", "Stansiyaning aylanmasligi"], ans: 0, exp: "400 km balandlikda gravitatsiya Yer sirtidagining ~88% ini tashkil etadi, lekin tayanch reaksiyasi (N = 0) yo‘qligi uchun vaznsizlik kuzatiladi." },
    { sec: "Fizika: Aerodinamika", q: "11. Kosmik kemani orbitadan Yerga qaytarishda (tushirishda) nima uchun tormozlash dvigateli ishga tushiriladi va maxsus issiqlik himoya qalqoni qo‘llaniladi?", opts: ["Tezlikni kamaytirib atmosferaga kiritish va havo qarshiligidan hosil bo‘ladigan o‘ta yuqori issiqlikdan himoyalanish uchun", "Kemani Quyoshga uchirish uchun", "Atmosferani sovutish uchun", "Radioaloqani o‘chirish uchun"], ans: 0, exp: "Tormoz импульsi orbitani pasaytiradi, zich atmosferada esa kinetik energiya issiqlikka aylanadi." },
    { sec: "Fizika: Vektorlar", q: "12. Orbita tekisligini burish yoki orbital tezlikni o‘zgartirish (manyovr) uchun raketa dvigatelining tortish kuchi qaysi fizik kattalikni o‘zgartiradi?", opts: ["Tezlik vektorining modulini yoki yo‘nalishini (Δv impuls)", "Yerning massasini", "Gravitatsiya doimiysini", "Quyoshning temperaturasini"], ans: 0, exp: "Kosmonavtikada har qanday orbital manyovr xarakteristik tezlik o‘zgarishi (Δv) bilan o‘lchanadi." },
    { sec: "Birliklar va hisob", q: "13. Yer radiusi R_Yer ≈ 6 400 km. Agar sun’iy yo‘ldosh Yer sirtidan h = 600 km balandlikda aylana orbita bo‘ylab uchayotgan bo‘lsa, orbita radiusi (r = R_Yer + h) qancha?", opts: ["7 000 km", "600 km", "5 800 km", "12 800 km"], ans: 0, exp: "Orbita radiusi Yer markazidan o‘lchanadi: r = 6400 + 600 = 7000 km." },
    { sec: "Birliklar va hisob", q: "14. Geostatsionar sun’iy yo‘ldosh Yerning o‘z o‘qi atrofida aylanish davriga teng davr bilan aylanadi va osmonning bir nuqtasida muallaq turgandek ko‘rinadi. Uning aylanish davri nechaga teng?", opts: ["≈ 24 soat (1 yulduz sutkasi — 23 soat 56 daqiqa)", "90 daqiqa", "27.3 sutka", "365 sutka"], ans: 0, exp: "Ekvator tekisligida ~35 786 km balandlikda aylanuvchi sun’iy yo‘ldosh Yer bilan sinxron aylanadi." },
    { sec: "Tayanch mantiq", q: "15. Nima sababdan kosmik raketalar bir bosqichli emas, balki ko‘p bosqichli (2–3 bosqichli) qilib quriladi?", opts: ["Yoqilg‘isi tugagan bo‘sh bak va dvigatellarni ajratib tashlab, foydali yukni tezlashtirish uchun ortiqcha massadan qutulish maqsadida", "Raketani chiroyliroq ko‘rsatish uchun", "Kosmosda gravitatsiyani yo‘qotish uchun", "Faqat bitta dvigatel yasash imkonsizligi uchun"], ans: 0, exp: "K.E. Siolkovskiy g‘oyasiga ko‘ra bosqichlarni ajratish minimal yoqilg‘i bilan kosmik tezlikka erishish imkonini beradi." },
    { sec: "Amaliy hisob", q: "16. Past Yer orbitasida uchayotgan kosmik stansiyaning orbital tezligi v ≈ 7.8 km/s, orbita uzunligi L ≈ 42 120 km. Stansiyaning Yer atrofida bir marta aylanish davri (T = L / v) necha daqiqa?", opts: ["≈ 90 daqiqa (5 400 s)", "≈ 24 soat", "≈ 15 daqiqa", "≈ 180 daqiqa"], ans: 0, exp: "T = 42 120 / 7.8 = 5 400 soniya = 90 daqiqa." },
    { sec: "Amaliy hisob", q: "17. Yerdan Oygacha o‘rtacha masofa ~384 000 km. Agar kosmik apparat Oygacha o‘rtacha ~1.6 km/s tezlik bilan harakatlansa, parvoz taxminan necha soat davom etadi?", opts: ["≈ 66.7 soat (≈ 2.8 sutka)", "≈ 1 soat", "≈ 300 soat", "≈ 10 daqiqa"], ans: 0, exp: "t = 384 000 / 1.6 = 240 000 s = 240 000 / 3600 ≈ 66.7 soat." },
    { sec: "Amaliy hisob", q: "18. Agar kosmik apparatning tezligi v₁ = 7.9 km/s dan v₂ = 11.2 km/s ga oshirilsa, uning solishtirma kinetik energiyasi (v²/2) taxminan necha marta ortadi?", opts: ["2 marta (chunki v₂ = √2 · v₁)", "4 marta", "1.4 marta", "8 marta"], ans: 0, exp: "(√2 · v₁)² = 2 · v₁² ⇒ kinetik energiya 2 marta ortadi." },
    { sec: "Amaliy vaziyat", q: "19. Nima sababdan kosmodromlar iloji boricha ekvatorga yaqinroq hududlarga quriladi va raketalar sharqqa tomon uchiriladi?", opts: ["Yerning g‘arbdan sharqqa aylanish chiziqli tezligidan (ekvatorda ~465 m/s) qo‘shimcha tezlik sifatida foydalanish uchun", "Ekvatorda tortishish kuchi nol bo‘lgani uchun", "Sharq tomonda havo yo‘qligi uchun", "Raketa qizib ketmasligi uchun"], ans: 0, exp: "Yer aylanishi yo‘nalishida uchirish yoqilg‘i sarfini sezilarli darajada tejaydi." },
    { sec: "Tayanch mantiq", q: "20. Boshqa sayyoraga (masalan, Marsga) uchishda kosmik apparat nega to‘g‘ri chiziq bo‘ylab emas, balki Quyosh tortishish maydonida yarim ellips shaklidagi traektoriya (Gomon orbitasi) bo‘ylab uchiriladi?", opts: ["Minimal yoqilg‘i (energiya) sarfi bilan eng tejamli parvozni amalga oshirish uchun", "To‘g‘ri chiziq bo‘ylab uchish qonun bilan taqiqlangani uchun", "Mars harakatsiz turgani uchun", "Quyosh gravitatsiyasi apparatni itargani uchun"], ans: 0, exp: "Gomon o‘tish orbitasi ikki sayyora orbitalariga urinma bo‘lib, eng kam Δv talab qiladi." }
  ];

  const variantB = [
    { sec: "Fizika: Impuls va Reaktiv harakat", q: "1. Reaktiv harakatda raketaning oladigan tezligi gazlarning chiqish tezligidan tashqari yana nimaga kuchli bog‘liq?", opts: ["Raketaning boshlang‘ich massasi va yonib bo‘lgandan keyingi oxirgi massasi nisbatiga", "Raketaning rangiga", "Havo namligiga", "Oy fazasiga"], ans: 0, exp: "Siolkovskiy formulasiga ko‘ra Δv = u · ln(m₀ / m) — yoqilg‘i ulushi qanchalik katta bo‘lsa, tezlik shunchalik yuqori bo‘ladi." },
    { sec: "Fizika: Nyuton qonunlari", q: "2. Nyutonning 3-qonuniga ko‘ra, raketa dvigateli yonish mahsulotlarini pastga F kuch bilan itarganda gazlar raketaga qanday kuch bilan ta’sir qiladi?", opts: ["Modul jihatidan teng (F) va yo‘nalishi qarama-qarshi (yuqoriga yo‘nalgan reaktiv tortish kuchi) bilan", "Nolga teng kuch bilan", "Pastga yo‘nalgan kuch bilan", "Yon tomonga yo‘nalgan kuch bilan"], ans: 0, exp: "Ta’sir va aks ta’sir kuchlari modul jihatidan teng va qarama-qarshi yo‘nalgan." },
    { sec: "Fizika: Impuls", q: "3. Massasi m = 5 000 kg bo‘lgan kosmik kema v = 6 km/s (6 000 m/s) tezlik bilan uchmoqda. Uning impulsi (p = m · v) nechaga teng?", opts: ["3 × 10⁷ kg·m/s", "3 × 10⁴ kg·m/s", "30 kg·m/s", "1.1 × 10⁴ kg·m/s"], ans: 0, exp: "p = 5000 × 6000 = 30 000 000 = 3 × 10⁷ kg·m/s." },
    { sec: "Fizika: Energiya", q: "4. Kosmik apparatning tezligi 3 marta kamaysa, uning kinetik energiyasi (E_k = m·v²/2) necha marta kamayadi?", opts: ["9 marta", "3 marta", "6 marta", "27 marta"], ans: 0, exp: "(v / 3)² = v² / 9 ⇒ kinetik energiya 9 marta kamayadi." },
    { sec: "Fizika: Energiya saqlanishi", q: "5. Elliptik orbitadagi sun’iy yo‘ldosh Yerdan eng uzoq nuqtaga (apogeyga) yetganda uning tezligi perigeydagiga nisbatan qanday bo‘ladi?", opts: ["Minimal (eng kichik)", "Maksimal (eng katta)", "Bir xil", "Yorug‘lik tezligiga teng"], ans: 0, exp: "Apogeyda potensial energiya maksimal, kinetik energiya va tezlik esa minimal bo‘ladi." },
    { sec: "Fizika: Kosmik tezliklar", q: "6. Quyosh tizimini butunlay tark etish (Yulduzlararo fazoga chiqish) uchun Yer orbitasi masofasidan start olgan apparatga zarur uchinchi kosmik tezlik taxminan qancha?", opts: ["≈ 16.7 km/s", "≈ 7.9 km/s", "≈ 11.2 km/s", "≈ 1.0 km/s"], ans: 0, exp: "Yerning orbital harakat yo‘nalishida uchirilganda v₃ ≈ 16.65 km/s." },
    { sec: "Fizika: Gravitatsiya", q: "7. Ikki sun’iy yo‘ldoshdan biri 500 km, ikkinchisi esa 20 000 km balandlikda aylana orbita bo‘ylab harakatlanmoqda. Qaysi birining orbital tezligi katta?", opts: ["500 km balandlikdagi yo‘ldoshning", "20 000 km balandlikdagi yo‘ldoshning", "Ikkalasining tezligi teng", "Aniqlab bo‘lmaydi"], ans: 0, exp: "v = √(GM/r) bo‘lgani uchun Yerga yaqinroq orbitada tezlik yuqori bo‘ladi." },
    { sec: "Geometriya: Konus kesimlari", q: "8. Agar kosmik apparatga Yer sirti yaqinida v = 9.5 km/s gorizontal tezlik berilsa (7.9 < 9.5 < 11.2 km/s), uning orbitasi qanday shaklda bo‘ladi?", opts: ["Ellips shaklida", "To‘g‘ri chiziq shaklida", "Giperbola shaklida", "Aylana shaklida"], ans: 0, exp: "Birinchi va ikkinchi kosmik tezliklar oralig‘ida yopiq elliptik orbita hosil bo‘ladi." },
    { sec: "Geometriya: Ellips elementlari", q: "9. Sun’iy yo‘ldosh orbitasining ekvator tekisligi bilan tashkil etgan burchagi nima deb ataladi?", opts: ["Orbita og‘maligi (qiyaligi — i)", "Orbita radiusi", "Perigey balandligi", "Azimut"], ans: 0, exp: "Orbita qiyaligi (i) yo‘ldoshning Yerning qaysi geografik kengliklari ustidan uchib o‘tishini belgilaydi." },
    { sec: "Fizika: Vaznsizlik", q: "10. Orbitada uchayotgan kosmik stansiya ichida suv tomchisi qanday shaklga kiradi?", opts: ["Sirt taranglik kuchi ta’sirida shar (sfera) shakliga", "Yassi plastinka shakliga", "Kub shakliga", "Pastga cho‘zilgan tomchi shakliga"], ans: 0, exp: "Vaznsizlik sharoitida tashqi og‘irlik kuchi sezilmagani uchun sirt taranglik suyuqlikka eng kichik yuzali sfera shaklini beradi." },
    { sec: "Fizika: Aerodinamika", q: "11. Nima sababdan sun’iy yo‘ldoshlar 100 km dan past balandlikda uzoq vaqt aylana olmaydi?", opts: ["Yuqori atmosfera qatlamlarining havosi bilan ishqalanish tezlikni kamaytirib, yo‘ldoshni pastga tushirib yuboradi", "100 km dan pastda tortishish kuchi yo‘q", "Quyosh nuri ularni eritib yuboradi", "Magnit maydon to‘xtatadi"], ans: 0, exp: "Atmosfera zichligi ortgan sari aerodinamik tormozlanish orbital energiyani tez kamaytiradi." },
    { sec: "Fizika: Vektorlar", q: "12. Sun’iy yo‘ldoshni pastki aylana orbitadan balandroq aylana orbitaga o‘tkazish uchun harakat yo‘nalishi bo‘ylab qo‘shimcha tezlik impulsi (Δv) berilganda, dastlab u qaysi orbitaga o‘tadi?", opts: ["O‘tish elliptik orbitasiga (perigeyi pastki orbitada, apogeyi yuqori orbitada)", "To‘g‘ri chiziqqa", "Yer markaziga", "To‘xtab qoladi"], ans: 0, exp: "Birinchi impuls elliptik o‘tish orbitasiga chiqaradi, apogeyda berilgan ikkinchi impuls esa orbitani aylanaga aylantiradi." },
    { sec: "Birliklar va hisob", q: "13. Yer radiusi R_Yer ≈ 6 400 km. Agar sun’iy yo‘ldoshning orbita radiusi r = 8 000 km bo‘lsa, uning Yer sirtidan balandligi (h = r − R_Yer) qancha?", opts: ["1 600 km", "8 000 km", "14 400 km", "3 200 km"], ans: 0, exp: "h = 8 000 − 6 400 = 1 600 km." },
    { sec: "Birliklar va hisob", q: "14. Geostatsionar orbitadagi aloqa va ob-havo sun’iy yo‘ldoshlarining Yerdagi antennalar uchun eng katta qulayligi nimada?", opts: ["Yerdan qaralganda osmonning bir nuqtasida doimiy turgandek ko‘rinadi va antennani burib turish shart emas", "Ular Yer sirtidan atigi 10 km balandlikda uchadi", "Ular har 10 daqiqada joyini o‘zgartiradi", "Ularda dvigatel bo‘lmaydi"], ans: 0, exp: "Sinxron aylanish sababli sun’iy yo‘ldosh Yer sirtining ma’lum hududi ustida doimiy aloqa ta’minlaydi." },
    { sec: "Tayanch mantiq", q: "15. Ko‘p bosqichli raketada eng oxirgi (yuqori) bosqichning massasi birinchi bosqichnikiga nisbatan qanday bo‘ladi?", opts: ["Ancha kichik (lekin eng yuqori tezlikka aynan shu oxirgi bosqich erishadi)", "100 marta katta", "Bir xil", "Nolga teng"], ans: 0, exp: "Har bir bosqich o‘zidan oldingi bosqich erishgan tezlik ustiga qo‘shimcha tezlik qo‘shadi." },
    { sec: "Amaliy hisob", q: "16. Agar sun’iy yo‘ldosh Yer atrofida 1 sutkada (24 soatda) 16 marta to‘liq aylanib chiqsa, uning bitta aylanish davri necha soat (necha daqiqa)?", opts: ["1.5 soat (90 daqiqa)", "16 soat", "2.4 soat", "45 daqiqa"], ans: 0, exp: "T = 24 soat / 16 = 1.5 soat = 90 daqiqa." },
    { sec: "Amaliy hisob", q: "17. Yerdan Marsga Gomon orbitasi bo‘yicha parvoz taxminan 258 sutka davom etadi. Bu taxminan necha oyga teng (1 oy ≈ 30 sutka)?", opts: ["≈ 8.6 oy", "≈ 2.5 oy", "≈ 25 oy", "≈ 12 oy"], ans: 0, exp: "258 / 30 = 8.6 oy." },
    { sec: "Amaliy hisob", q: "18. Agar kosmik apparat 36 000 km/soat tezlik bilan harakatlanayotgan bo‘lsa, uning tezligi km/s da nechaga teng?", opts: ["10 km/s", "36 km/s", "100 km/s", "1 km/s"], ans: 0, exp: "1 soat = 3600 s ⇒ 36 000 / 3 600 = 10 km/s." },
    { sec: "Amaliy vaziyat", q: "19. Sayyoralararo stansiyalar (masalan, Voyager) uzoq gigant sayyoralar (Yupiter, Saturn) yonidan uchib o‘tayotganda ularning tortishish maydonidan qanday maqsadda foydalanadi?", opts: ["Gravitatsion manyovr (tezlikni yoqilg‘i sarflamasdan oshirish va yo‘nalishni o‘zgartirish) uchun", "Sayyoraga qo‘nib yoqilg‘i quyish uchun", "Tezlikni nolga tushirish uchun", "Quyosh nurini to‘sish uchun"], ans: 0, exp: "Harakatlanayotgan sayyoraning tortishish maydonida uchib o‘tish apparatga qo‘shimcha impuls beradi." },
    { sec: "Tayanch mantiq", q: "20. Insoniyat tarixida Yerning birinchi sun’iy yo‘ldoshi («Sputnik-1») va birinchi kosmonavt (Yuriy Gagarin) parvozi qaysi yillarda amalga oshirilgan?", opts: ["1957-yil (4-oktabr) va 1961-yil (12-aprel)", "1945-yil va 1950-yil", "1969-yil va 1975-yil", "1981-yil va 1991-yil"], ans: 0, exp: "Kosmik era 1957-yil 4-oktabrda birinchi sun’iy yo‘ldosh uchirilishi bilan boshlangan." }
  ];

  let currentMode = 'A';
  let userAnswersA = new Array(variantA.length).fill(null);
  let userAnswersB = new Array(variantB.length).fill(null);
  let gradedA = false;
  let gradedB = false;

  function getActiveQuestions() { return currentMode === 'B' ? variantB : variantA; }
  function getActiveAnswers() { return currentMode === 'B' ? userAnswersB : userAnswersA; }
  function isActiveGraded() { return currentMode === 'B' ? gradedB : gradedA; }
  function setActiveGraded(val) {
    if (currentMode === 'B') gradedB = val;
    else gradedA = val;
  }

  function switchMode(mode) {
    currentMode = mode;
    document.getElementById('tabA').classList.toggle('active', mode === 'A');
    document.getElementById('tabB').classList.toggle('active', mode === 'B');
    document.getElementById('resultBox').style.display = 'none';

    renderQuestions();
    updateAnsweredPill();
    if (isActiveGraded()) gradeExam();
  }

  function renderQuestions() {
    const qs = getActiveQuestions();
    const ansArr = getActiveAnswers();
    const list = document.getElementById('questionsList');
    list.innerHTML = '';

    qs.forEach((item, qIndex) => {
      const card = document.createElement('div');
      card.className = 'q-card';

      const top = document.createElement('div');
      top.className = 'q-top';
      top.innerHTML = `<span>${currentMode} Variant — ${item.sec}</span><span>Savol #${qIndex + 1}</span>`;

      const qText = document.createElement('div');
      qText.className = 'q-text';
      qText.textContent = item.q;

      const opts = document.createElement('div');
      opts.className = 'opts';

      const letters = ['A', 'B', 'C', 'D'];
      item.opts.forEach((opt, oIndex) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = `${letters[oIndex]}) ${opt}`;
        if (ansArr[qIndex] === oIndex) btn.classList.add('selected');
        btn.onclick = () => {
          if (isActiveGraded()) return;
          ansArr[qIndex] = oIndex;
          updateAnsweredPill();
          Array.from(opts.children).forEach((c, idx) => {
            c.classList.toggle('selected', idx === oIndex);
          });
        };
        opts.appendChild(btn);
      });

      const exp = document.createElement('div');
      exp.className = 'explain';
      exp.id = `exp-${currentMode}-${qIndex}`;
      exp.textContent = `Izoh: ${item.exp}`;

      card.appendChild(top);
      card.appendChild(qText);
      card.appendChild(opts);
      card.appendChild(exp);
      list.appendChild(card);
    });
  }

  function updateAnsweredPill() {
    const ansArr = getActiveAnswers();
    const count = ansArr.filter(x => x !== null).length;
    document.getElementById('answeredPill').textContent = `Javoblar: ${count} / ${ansArr.length}`;
  }

  function gradeExam() {
    setActiveGraded(true);
    const qs = getActiveQuestions();
    const ansArr = getActiveAnswers();
    let correct = 0;
    const cards = document.getElementById('questionsList').children;

    qs.forEach((item, qIndex) => {
      const opts = cards[qIndex].querySelectorAll('.opt-btn');
      opts.forEach((btn, oIndex) => {
        btn.classList.remove('selected', 'correct', 'wrong');
        if (oIndex === item.ans) {
          btn.classList.add('correct');
        } else if (ansArr[qIndex] === oIndex) {
          btn.classList.add('wrong');
        }
      });
      if (ansArr[qIndex] === item.ans) correct++;
      document.getElementById(`exp-${currentMode}-${qIndex}`).style.display = 'block';
    });

    const pct = Math.round((correct / qs.length) * 100);
    let level = "Boshlang‘ich (Tayanch mavzularni takrorlash zarur)";
    let advice = "Tavsiya: Impulsning saqlanish qonuni, Nyuton qonunlari, kinetik/potensial energiya, birinchi va ikkinchi kosmik tezliklar hamda ellips elementlarini (perigey/apogey) takrorlang.";
    if (pct >= 86) {
      level = "Yuqori (5 — A'lo)";
      advice = "Ajoyib tayyorgarlik! Kosmonavtika elementlari (63–76-§§) bo‘limini o‘zlashtirishga to‘liq tayyorsiz.";
    } else if (pct >= 71) {
      level = "Yaxshi (4 — Yaxshi)";
      advice = "Yaxshi natija! Xato tushgan savollarning izohini ko‘rib, raketa harakati va orbital manyovrlar mavzulariga bemalol o‘ting.";
    } else if (pct >= 55) {
      level = "O‘rta (3 — Qoniqarli)";
      advice = "O‘rta daraja. Orbital tezlik, davr va birliklar (km/soat ↔ km/s) hisoblariga oid misollarni mustahkamlab oling.";
    }

    const name = document.getElementById('stName').value.trim() || "O‘quvchi";
    const cls = document.getElementById('stClass').value.trim();
    const dt = document.getElementById('stDate').value.trim();

    document.getElementById('resTitle').textContent = `Kosmonavtika Bo‘limi Kiruvchi Test Natijasi (${currentMode} Variant)`;
    document.getElementById('resStudent').textContent = `O‘quvchi: ${name}${cls ? ' — ' + cls : ''}${dt ? ' | Sana: ' + dt : ''}`;
    document.getElementById('resCorrect').textContent = `${correct} / ${qs.length}`;
    document.getElementById('resPercent').textContent = `${pct}%`;
    document.getElementById('resGrade').textContent = level;
    document.getElementById('resAdvice').textContent = advice;
    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });
  }

  function resetExam() {
    setActiveGraded(false);
    getActiveAnswers().fill(null);
    updateAnsweredPill();
    document.getElementById('resultBox').style.display = 'none';
    renderQuestions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  renderQuestions();
  updateAnsweredPill();
</script>
</body>
