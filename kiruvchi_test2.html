<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>2-Bob Kiruvchi Test | 11-sinf Astronomiya — Quyosh sistemasi va harakat</title>
  <style>
    :root {
      --bg: #050914;
      --panel: rgba(13, 21, 38, 0.94);
      --card: rgba(15, 23, 42, 0.88);
      --border: rgba(56, 189, 248, 0.28);
      --accent: #38bdf8;
      --gold: #fbbf24;
      --emerald: #34d399;
      --rose: #fb7185;
      --text: #f1f5f9;
      --muted: #94a3b8;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
      background: radial-gradient(circle at 50% 0%, #0f1c38 0%, var(--bg) 80%);
      color: var(--text);
      min-height: 100vh;
      line-height: 1.6;
    }

    header {
      position: sticky;
      top: 0;
      z-index: 20;
      padding: 13px 18px;
      background: rgba(5, 9, 20, 0.96);
      border-bottom: 1px solid var(--border);
      backdrop-filter: blur(8px);
      display: flex;
      flex-wrap: wrap;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
    }

    .brand h1 { font-size: 1.02rem; color: var(--accent); font-weight: 700; }
    .brand p { font-size: 0.78rem; color: var(--muted); }

    .mode-tabs { display: flex; gap: 6px; flex-wrap: wrap; }

    .tab-btn {
      background: rgba(30, 41, 59, 0.85);
      border: 1px solid var(--border);
      color: var(--text);
      padding: 7px 12px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.18s;
    }

    .tab-btn:hover { border-color: var(--accent); }
    .tab-btn.active {
      background: linear-gradient(135deg, #0284c7, #1d4ed8);
      border-color: #7dd3fc;
      color: #fff;
    }

    .status-bar {
      display: flex;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
    }

    .pill {
      background: rgba(15, 23, 42, 0.95);
      border: 1px solid var(--border);
      padding: 6px 11px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      color: var(--gold);
    }

    .btn {
      background: linear-gradient(135deg, #0284c7, #1d4ed8);
      border: 1px solid #7dd3fc;
      color: #fff;
      padding: 7px 13px;
      border-radius: 8px;
      font-size: 0.8rem;
      font-weight: 600;
      cursor: pointer;
      transition: 0.2s;
    }

    .btn:hover { filter: brightness(1.12); }
    .btn.secondary {
      background: rgba(30, 41, 59, 0.9);
      border-color: rgba(148, 163, 184, 0.35);
      color: var(--text);
    }

    .container {
      max-width: 980px;
      margin: 20px auto;
      padding: 0 16px 50px;
      display: flex;
      flex-direction: column;
      gap: 16px;
    }

    .meta-card {
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 14px;
      padding: 16px 20px;
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(190px, 1fr));
      gap: 12px;
    }

    .meta-card label { display: block; font-size: 0.78rem; color: var(--muted); margin-bottom: 4px; }
    .meta-card input {
      width: 100%;
      padding: 8px 10px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.3);
      background: rgba(2, 6, 23, 0.85);
      color: var(--text);
      font-size: 0.88rem;
    }

    .q-card {
      background: var(--card);
      border: 1px solid rgba(148, 163, 184, 0.2);
      border-radius: 12px;
      padding: 17px 20px;
    }

    .q-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 10px;
      margin-bottom: 8px;
      font-size: 0.8rem;
      color: var(--accent);
      font-weight: 700;
    }

    .q-text {
      font-size: 0.95rem;
      font-weight: 600;
      color: var(--text);
      margin-bottom: 12px;
    }

    .opts { display: flex; flex-direction: column; gap: 8px; }

    .opt-btn {
      width: 100%;
      text-align: left;
      padding: 10px 13px;
      border-radius: 8px;
      border: 1px solid rgba(148, 163, 184, 0.25);
      background: rgba(30, 41, 59, 0.82);
      color: var(--text);
      font-size: 0.88rem;
      cursor: pointer;
      transition: 0.16s;
    }

    .opt-btn:hover { border-color: var(--accent); background: rgba(56, 189, 248, 0.14); }
    .opt-btn.selected { border-color: var(--gold); background: rgba(251, 191, 36, 0.18); }
    .opt-btn.correct { border-color: var(--emerald); background: rgba(16, 185, 129, 0.25); color: #d1fae5; }
    .opt-btn.wrong { border-color: var(--rose); background: rgba(244, 63, 94, 0.25); color: #ffe4e6; }

    .explain {
      margin-top: 10px;
      padding-top: 8px;
      border-top: 1px dashed rgba(148, 163, 184, 0.25);
      font-size: 0.84rem;
      color: var(--emerald);
      display: none;
    }

    .result-box {
      background: var(--panel);
      border: 1px solid var(--emerald);
      border-radius: 14px;
      padding: 20px 22px;
      display: none;
    }

    .result-box h2 { color: var(--gold); font-size: 1.18rem; margin-bottom: 8px; }
    .score-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(160px, 1fr));
      gap: 12px;
      margin: 12px 0;
    }

    .score-item {
      background: rgba(2, 6, 23, 0.85);
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 12px;
    }

    .score-item span { display: block; font-size: 0.78rem; color: var(--muted); }
    .score-item strong { font-size: 1.12rem; color: var(--emerald); }

    .actions-bottom {
      display: flex;
      gap: 10px;
      flex-wrap: wrap;
      justify-content: flex-end;
      margin-top: 6px;
    }
  </style>
</head>
<body>

<header>
  <div class="brand">
    <h1>2-BOB KIRUVCHI TEST — 11-SINF ASTRONOMIYA</h1>
    <p>Quyosh sistemasi tuzilishi va harakat (18–27-§§ oldidan tayanch bilimlar) | A/B Variant (20 savoldan)</p>
  </div>
  <div class="mode-tabs">
    <button class="tab-btn active" id="tabA" onclick="switchMode('A')">A Variant (20 savol)</button>
    <button class="tab-btn" id="tabB" onclick="switchMode('B')">B Variant (20 savol)</button>
  </div>
  <div class="status-bar">
    <div class="pill" id="answeredPill">Javoblar: 0 / 20</div>
    <button class="btn" onclick="gradeExam()">Yakunlash va baholash</button>
    <button class="btn secondary" onclick="resetExam()">Qayta boshlash</button>
  </div>
</header>

<div class="container">
  <div class="meta-card">
    <div>
      <label for="stName">O‘quvchining F.I.Sh.:</label>
      <input type="text" id="stName" placeholder="Masalan: Karimov Azizbek" />
    </div>
    <div>
      <label for="stClass">Sinf va maktab:</label>
      <input type="text" id="stClass" placeholder="Masalan: 11-«A» sinf" />
    </div>
    <div>
      <label for="stDate">Sana:</label>
      <input type="text" id="stDate" value="2026-11-26" />
    </div>
  </div>

  <div id="resultBox" class="result-box">
    <h2 id="resTitle">2-Bob Kiruvchi Test Natijasi</h2>
    <p id="resStudent" style="color: var(--muted); font-size: 0.88rem;"></p>
    <div class="score-grid">
      <div class="score-item"><span>To‘g‘ri javoblar</span><strong id="resCorrect">0 / 20</strong></div>
      <div class="score-item"><span>Foiz ko‘rsatkichi</span><strong id="resPercent">0%</strong></div>
      <div class="score-item"><span>Tayyorgarlik darajasi</span><strong id="resGrade">—</strong></div>
    </div>
    <p id="resAdvice" style="font-size: 0.86rem; color: #cbd5e1;"></p>
  </div>

  <div id="questionsList" style="display:flex; flex-direction:column; gap:14px;"></div>

  <div class="actions-bottom">
    <button class="btn" onclick="gradeExam()">Yakunlash va baholash</button>
    <button class="btn secondary" onclick="resetExam()">Qayta boshlash</button>
  </div>
</div>

<script>
  const variantA = [
    { sec: "Geometriya: Aylana", q: "1. Diametri D = 12 000 km bo‘lgan aylananing radiusi (R) nechaga teng?", opts: ["6 000 km", "24 000 km", "12 000 km", "3 000 km"], ans: 0, exp: "Radius diametrning yarmiga teng: R = D / 2 = 12 000 / 2 = 6 000 km." },
    { sec: "Geometriya: Ellips", q: "2. Ellipsning aylana (R) dan asosiy geometrik farqi nimada?", opts: ["Ellipsning ikkita fokus markazi va ikkita o‘qi (katta va kichik yarim o‘qlari) bor", "Ellipsda radius mavjud emas", "Ellips har doim to‘g‘ri to‘rtburchak shaklida bo‘ladi", "Ellipsning uzunligi doimo nolinchi bo‘ladi"], ans: 0, exp: "Aylana ellipsning xususiy holi bo‘lib, uning ikki fokusi bitta markazda ustma-ust tushadi." },
    { sec: "Matematika: Daraja", q: "3. Agar a = 3 bo‘lsa, a³ (uchinchi daraja) qiymati nechaga teng?", opts: ["27", "9", "81", "6"], ans: 0, exp: "3³ = 3 × 3 × 3 = 27." },
    { sec: "Matematika: Ildiz", q: "4. Kvadrat ildiz √64 nimaga teng?", opts: ["8", "32", "4", "16"], ans: 0, exp: "8² = 64 bo‘lgani uchun √64 = 8." },
    { sec: "Matematika: Nisbat", q: "5. Ikki kattalikning nisbati 1 : 4 ko‘rinishida bo‘lsa, ikkinchi kattalik birinchisidan necha marta katta?", opts: ["4 marta", "2 marta", "1/4 marta", "8 marta"], ans: 0, exp: "1 : 4 nisbat ikkinchi sonning birinchisidan 4 barobar kattaligini bildiradi." },
    { sec: "Fizika: Gravitatsiya", q: "6. Butun olam tortishish qonuniga ko‘ra ikki jism orasidagi masofa 3 marta ortsa, tortishish kuchi qanday o‘zgaradi?", opts: ["9 marta kamayadi", "3 marta kamayadi", "9 marta ortadi", "O‘zgarmaydi"], ans: 0, exp: "F ~ 1 / r² bo‘lgani uchun masofa 3 marta ortganda kuch 3² = 9 marta kamayadi." },
    { sec: "Fizika: Gravitatsiya", q: "7. Markaziy jismning massasi (M) 2 marta ortganda, uning tortishish kuchi qanday o‘zgaradi?", opts: ["2 marta ortadi", "4 marta ortadi", "2 marta kamayadi", "O‘zgarmaydi"], ans: 0, exp: "Tortishish kuchi jismlar massalarining ko‘paytmasiga to‘g‘ri proporsional: F ~ M." },
    { sec: "Fizika: Aylana harakat", q: "8. Radiusi R bo‘lgan aylana bo‘ylab v tezlik bilan harakatlanayotgan jismning markazga intilma tezlanishi formulasi qaysi?", opts: ["a = v² / R", "a = v · R", "a = R / v", "a = 2πR / v"], ans: 0, exp: "Markazga intilma tezlanish a = v² / R." },
    { sec: "Fizika: Davr va tezlik", q: "9. Radiusi R bo‘lgan aylana bo‘ylab tekis aylanayotgan jismning aylanish davri (T) va chiziqli tezligi (v) orasidagi bog‘lanish qaysi?", opts: ["v = 2πR / T", "v = T / (2πR)", "v = πR² / T", "v = 2πT / R"], ans: 0, exp: "Bir davr T ichida jism 2πR uzunlikdagi aylanani bosib o‘tadi: v = 2πR / T." },
    { sec: "Fizika: Kosmik tezlik", q: "10. Yer sirti yaqinida birinchi kosmik tezlik taxminan nechaga teng?", opts: ["≈ 7.9 km/s", "≈ 11.2 km/s", "≈ 30 km/s", "≈ 300 000 km/s"], ans: 0, exp: "Yerning sun’iy yo‘ldoshi bo‘lib qolish uchun zarur minimal gorizontal tezlik ~7.91 km/s." },
    { sec: "Fizika: Kosmik tezlik", q: "11. Yerning tortishish maydonidan butunlay chiqib ketish uchun zarur ikkinchi kosmik tezlik taxminan qancha?", opts: ["≈ 11.2 km/s", "≈ 7.9 km/s", "≈ 1.7 km/s", "≈ 340 m/s"], ans: 0, exp: "Ikkinchi kosmik tezlik ~11.19 km/s bo‘lib, birinchi kosmik tezlikdan √2 marta katta." },
    { sec: "Quyosh sistemasi", q: "12. Quyosh tizimidagi 8 ta sayyoraning Quyoshdan uzoqlashish tartibida 3-o‘rinda qaysi sayyora turadi?", opts: ["Yer", "Mars", "Venera", "Merkuriy"], ans: 0, exp: "1. Merkuriy, 2. Venera, 3. Yer, 4. Mars, 5. Yupiter, 6. Saturn, 7. Uran, 8. Neptun." },
    { sec: "Quyosh sistemasi", q: "13. Qaysi sayyoralar «ichki (quyi) sayyoralar» deb ataladi?", opts: ["Merkuriy va Venera", "Mars va Yupiter", "Saturn va Neptun", "Yer va Mars"], ans: 0, exp: "Orbitasi Yer orbitasidan ichkarida joylashgan sayyoralar Merkuriy va Veneradir." },
    { sec: "Quyosh sistemasi", q: "14. Quyosh tizimida asosiy asteroidlar kamari qaysi ikki sayyora orbitalari orasida joylashgan?", opts: ["Mars va Yupiter", "Yer va Mars", "Yupiter va Saturn", "Merkuriy va Venera"], ans: 0, exp: "Asosiy asteroidlar kamari Mars va Yupiter orbitalari oralig‘ida joylashgan." },
    { sec: "Harakat nisbiyligi", q: "15. Ikki jism bir xil yo‘nalishda, lekin turlicha tezlikda harakatlansa, ularning o‘zaro yaqinlashish/uzoqlashish tezligi nimaga bog‘liq?", opts: ["Tezliklari farqiga", "Faqat massalariga", "Faqat temperaturaga", "Og‘irlik kuchiga"], ans: 0, exp: "Bir yo‘nalishda harakatlanayotgan jismlarning nisbiy tezligi ularning tezliklari ayirmasi bilan aniqlanadi." },
    { sec: "Birliklar", q: "16. 1 kilometr necha metrga teng?", opts: ["1 000 m", "100 m", "10 000 m", "1 000 000 m"], ans: 0, exp: "1 km = 1000 m." },
    { sec: "Birliklar", q: "17. 1 soat necha soniyaga teng?", opts: ["3 600 s", "60 s", "360 s", "86 400 s"], ans: 0, exp: "1 soat = 60 daqiqa × 60 soniya = 3600 soniya." },
    { sec: "Amaliy hisob", q: "18. Jism 6 km yo‘lni 2 soniyada bosib o‘tsa, uning o‘rtacha tezligi nechaga teng?", opts: ["3 km/s", "12 km/s", "1/3 km/s", "8 km/s"], ans: 0, exp: "v = s / t = 6 km / 2 s = 3 km/s." },
    { sec: "Amaliy vaziyat", q: "19. Nima sababdan Quyoshga yaqin sayyoralar (masalan, Merkuriy) Quyosh atrofida Neptunga qaraganda ancha tez aylanadi?", opts: ["Quyosh tortishish kuchi yaqin masofada kuchliroq va orbita uzunligi kichikroq bo‘lgani uchun", "Merkuriyning massasi Neptunnikidan katta bo‘lgani uchun", "Neptunda gravitatsiya bo‘lmagani uchun", "Merkuriy teskari yo‘nalishda aylangani uchun"], ans: 0, exp: "Quyoshga yaqinlashgan sari markaziy tortishish kuchi ortadi va orbital tezlik yuqori bo‘ladi." },
    { sec: "Tayanch mantiq", q: "20. Agar jismga markazga yo‘nalgan tortishish kuchi ta’sir qilmasa, uning harakati qanday bo‘ladi?", opts: ["Inersiya bo‘yicha to‘g‘ri chiziqli tekis harakat qiladi", "Aylana bo‘ylab aylanishda davom etadi", "Ellips chizadi", "O‘z-o‘zidan to‘xtaydi"], ans: 0, exp: "Nyutonning 1-qonuniga ko‘ra tashqi kuch ta’sir qilmasa, jism to‘g‘ri chiziqli tekis harakatlanadi." }
  ];

  const variantB = [
    { sec: "Geometriya: Aylana", q: "1. Radiusi R = 5 000 km bo‘lgan aylananing diametri (D) nechaga teng?", opts: ["10 000 km", "2 500 km", "5 000 km", "20 000 km"], ans: 0, exp: "Diametr ikki radiusga teng: D = 2R = 2 × 5 000 = 10 000 km." },
    { sec: "Geometriya: Ellips", q: "2. Katta yarim o‘qi a = 2 a.b. bo‘lgan ellipsning katta o‘qi (2a) uzunligi nechaga teng?", opts: ["4 a.b.", "2 a.b.", "1 a.b.", "8 a.b."], ans: 0, exp: "Katta o‘q katta yarim o‘qdan ikki marta katta: 2a = 2 × 2 = 4 a.b." },
    { sec: "Matematika: Daraja", q: "3. Agar a = 2 bo‘lsa, a³ (uchinchi daraja) qiymati nechaga teng?", opts: ["8", "6", "4", "16"], ans: 0, exp: "2³ = 2 × 2 × 2 = 8." },
    { sec: "Matematika: Ildiz", q: "4. Kub ildiz ∛27 nimaga teng?", opts: ["3", "9", "27", "6"], ans: 0, exp: "3³ = 27 bo‘lgani uchun ∛27 = 3." },
    { sec: "Matematika: Nisbat", q: "5. Agar a / b = 1/9 bo‘lsa, b qiymati a qiymatidan necha marta katta?", opts: ["9 marta", "3 marta", "1/9 marta", "18 marta"], ans: 0, exp: "a / b = 1/9 ⇒ b = 9a." },
    { sec: "Fizika: Gravitatsiya", q: "6. Ikki jism orasidagi masofa 2 marta kamaytirilsa, ular orasidagi tortishish kuchi qanday o‘zgaradi?", opts: ["4 marta ortadi", "2 marta ortadi", "4 marta kamayadi", "O‘zgarmaydi"], ans: 0, exp: "F ~ 1 / r² bo‘lgani uchun r ikki marta kamaysa, F 2² = 4 marta ortadi." },
    { sec: "Fizika: Gravitatsiya", q: "7. Markaziy jismning massasi (M) 4 marta ortganda, uning gravitatsion tortishish kuchi qanday o‘zgaradi?", opts: ["4 marta ortadi", "2 marta ortadi", "4 marta kamayadi", "16 marta ortadi"], ans: 0, exp: "Tortishish kuchi massaga to‘g‘ri proporsional: 4 marta ortadi." },
    { sec: "Fizika: Aylana harakat", q: "8. Aylana bo‘ylab harakatda chiziqli tezlik (v) 2 marta ortsa, markazga intilma tezlanish (a = v²/R) necha marta ortadi?", opts: ["4 marta", "2 marta", "8 marta", "1/2 marta"], ans: 0, exp: "v kvadratga ko‘tarilgani uchun (2v)² = 4v², ya’ni tezlanish 4 marta ortadi." },
    { sec: "Fizika: Davr va tezlik", q: "9. Jismning aylanish davri T = 10 s bo‘lsa, u 1 soniyada necha aylanish qiladi (aylanish chastotasi)?", opts: ["0.1 aylanish/s (0.1 Gs)", "10 aylanish/s", "100 aylanish/s", "1 aylanish/s"], ans: 0, exp: "Chastota davrga teskari kattalik: ν = 1 / T = 1 / 10 = 0.1 Gs." },
    { sec: "Fizika: Kosmik tezlik", q: "10. Birinchi kosmik tezlikning fizik ma’nosi nimadan iborat?", opts: ["Jismning Yer sirtiga yiqilmasdan aylana orbita bo‘ylab harakatlanishini ta’minlovchi minimal tezlik", "Jismning yuqoriga vertikal uchish tezligi", "Joriy shamol tezligi", "Yorug‘lik tezligi"], ans: 0, exp: "Birinchi kosmik tezlikda jismning erkin tushish egri chizig‘i Yer sirtining egriligiga mos keladi." },
    { sec: "Fizika: Kosmik tezlik", q: "11. Ikkinchi kosmik tezlikning fizik ma’nosi nimadan iborat?", opts: ["Jismning markaziy osmon jismi tortishish maydonini yengib, undan uzoqlashishini ta’minlovchi tezlik", "Jismning to‘xtab qolish tezligi", "Faqat samolyot tezligi", "Tovush tezligi"], ans: 0, exp: "Ikkinchi kosmik tezlikda (parabolik tezlikda) jism markaziy jism maydonini tark etadi." },
    { sec: "Quyosh sistemasi", q: "12. Quyosh tizimidagi eng uzoq joylashgan katta sayyora qaysi?", opts: ["Neptun", "Uran", "Saturn", "Yupiter"], ans: 0, exp: "Neptun Quyoshdan eng uzoq (8-sayyora) masofada joylashgan." },
    { sec: "Quyosh sistemasi", q: "13. Qaysi sayyoralar «tashqi sayyoralar» guruhiga kiradi?", opts: ["Mars, Yupiter, Saturn, Uran, Neptun", "Faqat Merkuriy va Venera", "Yer va Venera", "Faqat Merkuriy"], ans: 0, exp: "Yer orbitasidan tashqarida joylashgan barcha sayyoralar tashqi sayyoralardir." },
    { sec: "Quyosh sistemasi", q: "14. Quyosh tizimidagi asosiy markaziy jism (tizim massasining ~99.8% qismini tashkil etuvchi jism) qaysi?", opts: ["Quyosh", "Yupiter", "Yer", "Saturn"], ans: 0, exp: "Quyosh sistemasi massasining deyarli barchasi Quyoshda jamlangan." },
    { sec: "Harakat nisbiyligi", q: "15. Agar ikki mashina qarama-qarshi tomonga 40 km/soat va 60 km/soat tezlikda harakatlansa, ularning yaqinlashish tezligi qancha?", opts: ["100 km/soat", "20 km/soat", "60 km/soat", "40 km/soat"], ans: 0, exp: "Qarama-qarshi harakatda yaqinlashish tezligi tezliklar yig‘indisiga teng: 40 + 60 = 100 km/soat." },
    { sec: "Birliklar", q: "16. 1 sutka necha soatga teng?", opts: ["24 soat", "12 soat", "60 soat", "365 soat"], ans: 0, exp: "1 sutka = 24 soat." },
    { sec: "Birliklar", q: "17. 1 metr necha santimetrga teng?", opts: ["100 sm", "10 sm", "1 000 sm", "50 sm"], ans: 0, exp: "1 m = 100 sm." },
    { sec: "Amaliy hisob", q: "18. Jism v = 12 km/s tezlik bilan t = 5 s harakatlansa, qancha masofa (s) bosib o‘tadi?", opts: ["60 km", "2.4 km", "17 km", "7 km"], ans: 0, exp: "s = v · t = 12 × 5 = 60 km." },
    { sec: "Amaliy vaziyat", q: "19. Nima sababdan sayyoralar Quyosh atrofida aylanishda davom etadi va Quyoshga tushib ketmaydi?", opts: ["Ularning orbital harakat tezligi (inersiyasi) va markazga intilma tortishish kuchi muvozanatli bo‘lgani uchun", "Kosmosda tortishish kuchi yo‘qligi uchun", "Sayyoralar o‘zidan itarilish kuchi chiqargani uchun", "Quyosh ularni itarib turgani uchun"], ans: 0, exp: "Tortishish kuchi markazga intilma tezlanish hosil qiladi, sayyoraning yonlama tezligi esa uni o‘tib ketishga undaydi." },
    { sec: "Tayanch mantiq", q: "20. Agar bir xil massa va tezlikdagi jismlar turlicha radiusli aylanalar bo‘ylab harakatlansa, qaysi aylanada markazga intilma tezlanish katta bo‘ladi?", opts: ["Radiusi kichikroq bo‘lgan aylanada", "Radiusi kattaroq bo‘lgan aylanada", "Ikkalasida bir xil", "Aylanish bo‘lmaydi"], ans: 0, exp: "a = v² / R bo‘lgani uchun v o‘zgarmas bo‘lganda R kichiklashgan sari a kattalashadi." }
  ];

  let currentMode = 'A';
  let userAnswersA = new Array(variantA.length).fill(null);
  let userAnswersB = new Array(variantB.length).fill(null);
  let gradedA = false;
  let gradedB = false;

  function getActiveQuestions() { return currentMode === 'B' ? variantB : variantA; }
  function getActiveAnswers() { return currentMode === 'B' ? userAnswersB : userAnswersA; }
  function isActiveGraded() { return currentMode === 'B' ? gradedB : gradedA; }
  function setActiveGraded(val) {
    if (currentMode === 'B') gradedB = val;
    else gradedA = val;
  }

  function switchMode(mode) {
    currentMode = mode;
    document.getElementById('tabA').classList.toggle('active', mode === 'A');
    document.getElementById('tabB').classList.toggle('active', mode === 'B');
    document.getElementById('resultBox').style.display = 'none';

    renderQuestions();
    updateAnsweredPill();
    if (isActiveGraded()) gradeExam();
  }

  function renderQuestions() {
    const qs = getActiveQuestions();
    const ansArr = getActiveAnswers();
    const list = document.getElementById('questionsList');
    list.innerHTML = '';

    qs.forEach((item, qIndex) => {
      const card = document.createElement('div');
      card.className = 'q-card';

      const top = document.createElement('div');
      top.className = 'q-top';
      top.innerHTML = `<span>${currentMode} Variant — ${item.sec}</span><span>Savol #${qIndex + 1}</span>`;

      const qText = document.createElement('div');
      qText.className = 'q-text';
      qText.textContent = item.q;

      const opts = document.createElement('div');
      opts.className = 'opts';

      const letters = ['A', 'B', 'C', 'D'];
      item.opts.forEach((opt, oIndex) => {
        const btn = document.createElement('button');
        btn.className = 'opt-btn';
        btn.textContent = `${letters[oIndex]}) ${opt}`;
        if (ansArr[qIndex] === oIndex) btn.classList.add('selected');
        btn.onclick = () => {
          if (isActiveGraded()) return;
          ansArr[qIndex] = oIndex;
          updateAnsweredPill();
          Array.from(opts.children).forEach((c, idx) => {
            c.classList.toggle('selected', idx === oIndex);
          });
        };
        opts.appendChild(btn);
      });

      const exp = document.createElement('div');
      exp.className = 'explain';
      exp.id = `exp-${currentMode}-${qIndex}`;
      exp.textContent = `Izoh: ${item.exp}`;

      card.appendChild(top);
      card.appendChild(qText);
      card.appendChild(opts);
      card.appendChild(exp);
      list.appendChild(card);
    });
  }

  function updateAnsweredPill() {
    const ansArr = getActiveAnswers();
    const count = ansArr.filter(x => x !== null).length;
    document.getElementById('answeredPill').textContent = `Javoblar: ${count} / ${ansArr.length}`;
  }

  function gradeExam() {
    setActiveGraded(true);
    const qs = getActiveQuestions();
    const ansArr = getActiveAnswers();
    let correct = 0;
    const cards = document.getElementById('questionsList').children;

    qs.forEach((item, qIndex) => {
      const opts = cards[qIndex].querySelectorAll('.opt-btn');
      opts.forEach((btn, oIndex) => {
        btn.classList.remove('selected', 'correct', 'wrong');
        if (oIndex === item.ans) {
          btn.classList.add('correct');
        } else if (ansArr[qIndex] === oIndex) {
          btn.classList.add('wrong');
        }
      });
      if (ansArr[qIndex] === item.ans) correct++;
      document.getElementById(`exp-${currentMode}-${qIndex}`).style.display = 'block';
    });

    const pct = Math.round((correct / qs.length) * 100);
    let level = "Boshlang‘ich (Tayanch mavzularni takrorlash zarur)";
    let advice = "Tavsiya: Kvadrat/kub daraja va ildizlar, Butun olam tortishish qonuni (F ~ 1/r²), markazga intilma tezlanish (a = v²/R) hamda Quyosh tizimi sayyoralari tartibini takrorlang.";
    if (pct >= 86) {
      level = "Yuqori (5 — A'lo)";
      advice = "Ajoyib tayyorgarlik! 2-bob (Quyosh sistemasi tuzilishi va harakat) mavzularini o‘zlashtirishga to‘liq tayyorsiz.";
    } else if (pct >= 71) {
      level = "Yaxshi (4 — Yaxshi)";
      advice = "Yaxshi natija! Xato tushgan savollarning izohini ko‘rib, Kepler qonunlari va kosmik tezliklar mavzulariga bemalol o‘ting.";
    } else if (pct >= 55) {
      level = "O‘rta (3 — Qoniqarli)";
      advice = "O‘rta daraja. Daraja/ildiz hisoblari va gravitatsion nisbatlarga oid misollarni mustahkamlab oling.";
    }

    const name = document.getElementById('stName').value.trim() || "O‘quvchi";
    const cls = document.getElementById('stClass').value.trim();
    const dt = document.getElementById('stDate').value.trim();

    document.getElementById('resTitle').textContent = `2-Bob Kiruvchi Test Natijasi (${currentMode} Variant)`;
    document.getElementById('resStudent').textContent = `O‘quvchi: ${name}${cls ? ' — ' + cls : ''}${dt ? ' | Sana: ' + dt : ''}`;
    document.getElementById('resCorrect').textContent = `${correct} / ${qs.length}`;
    document.getElementById('resPercent').textContent = `${pct}%`;
    document.getElementById('resGrade').textContent = level;
    document.getElementById('resAdvice').textContent = advice;
    document.getElementById('resultBox').style.display = 'block';
    document.getElementById('resultBox').scrollIntoView({ behavior: 'smooth' });
  }

  function resetExam() {
    setActiveGraded(false);
    getActiveAnswers().fill(null);
    updateAnsweredPill();
    document.getElementById('resultBox').style.display = 'none';
    renderQuestions();
    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  renderQuestions();
  updateAnsweredPill();
</script>
</body>
</html>
